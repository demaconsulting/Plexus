---
# FileAssert document validation tests for Plexus.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: api-docs, build-notes, code-quality, code-review, design, verification, user-guide, requirements.
#
# NOTE: api-docs tests run in the build job after `dotnet pack` and assert on the NuGet packages;
# they provide OTS evidence for ApiMark. build-notes through user-guide tests provide OTS evidence
# for Pandoc and WeasyPrint and run before ReqStream. The requirements tests run after ReqStream
# and validate the final outputs, but do not contribute to OTS requirements evidence.

tests:

  # --- API DOCUMENTATION ---
  # These tests run in the build job, after `dotnet pack`, against the produced NuGet packages.
  # They provide OTS evidence for ApiMark (docs/reqstream/ots/apimark.yaml).

  - name: ApiMark_CoreApiDocsPacked
    description: "The DemaConsulting.Plexus package contains the API reference generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus/bin/Release/DemaConsulting.Plexus.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/api.md"
              min: 1
              max: 1
              text:
                - contains: "DemaConsulting.Plexus.Scene"
            - pattern: "api/DemaConsulting.Plexus.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Plexus/Diagram.md"
              min: 1
              max: 1
            - pattern: "api/**/*.md"
              min: 100

  - name: ApiMark_RenderingApiDocsPacked
    description: "The DemaConsulting.Plexus.Rendering package contains the API reference generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus.Rendering/bin/Release/DemaConsulting.Plexus.Rendering.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/api.md"
              min: 1
              max: 1
              text:
                - contains: "DemaConsulting.Plexus.Rendering"
            - pattern: "api/DemaConsulting.Plexus.Rendering.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Plexus.Rendering/PlexusRenderer.md"
              min: 1
              max: 1
            - pattern: "api/**/*.md"
              min: 10

  - name: ApiMark_AvaloniaApiDocsPacked
    description: "The DemaConsulting.Plexus.Avalonia package contains the API reference generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus.Avalonia/bin/Release/DemaConsulting.Plexus.Avalonia.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/api.md"
              min: 1
              max: 1
              text:
                - contains: "DemaConsulting.Plexus.Avalonia"
            - pattern: "api/DemaConsulting.Plexus.Avalonia.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Plexus.Avalonia/DiagramEditor.md"
              min: 1
              max: 1
            - pattern: "api/**/*.md"
              min: 50

  - name: ApiMark_PropertyGridApiDocsPacked
    description: "The PropertyGrid package contains the API reference generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus.Avalonia.PropertyGrid/bin/Release/\
          DemaConsulting.Plexus.Avalonia.PropertyGrid.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/api.md"
              min: 1
              max: 1
              text:
                - contains: "DemaConsulting.Plexus.Avalonia.PropertyGrid"
                - contains: "DemaConsulting.Plexus.Avalonia.PropertyGrid.Plexus"
            - pattern: "api/DemaConsulting.Plexus.Avalonia.PropertyGrid.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Plexus.Avalonia.PropertyGrid/PropertyGrid.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Plexus.Avalonia.PropertyGrid/Plexus.md"
              min: 1
              max: 1
            - pattern: "api/**/*.md"
              min: 100

  - name: ApiMark_NamespaceDocRendered
    description: "Namespace documentation reaches the generated namespace pages with its usage example first"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus/bin/Release/DemaConsulting.Plexus.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/DemaConsulting.Plexus.md"
              min: 1
              max: 1
              text:
                - contains: "hello diagram"
                - matches: "(?s)hello diagram.*```csharp.*Pages\\.Add.*History\\.Undo.*ToJson"
            - pattern: "api/DemaConsulting.Plexus/Scene.md"
              min: 1
              max: 1
              text:
                - contains: "DiagramTheme.Classic with"
            - pattern: "api/DemaConsulting.Plexus/Routing.md"
              min: 1
              max: 1
              text:
                - contains: "IWireRouter"
            - pattern: "api/DemaConsulting.Plexus/Geometry.md"
              min: 1
              max: 1
              text:
                - contains: "Color.Parse"
      - pattern: "src/DemaConsulting.Plexus.Rendering/bin/Release/DemaConsulting.Plexus.Rendering.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/DemaConsulting.Plexus.Rendering.md"
              min: 1
              max: 1
              text:
                - contains: "PlexusRenderer.SavePng"
      - pattern: "src/DemaConsulting.Plexus.Avalonia/bin/Release/DemaConsulting.Plexus.Avalonia.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/DemaConsulting.Plexus.Avalonia.md"
              min: 1
              max: 1
              text:
                - contains: "plexus:DiagramEditor"
                - contains: "plexus:NodePalette"
      - pattern: "src/DemaConsulting.Plexus.Avalonia.PropertyGrid/bin/Release/\
          DemaConsulting.Plexus.Avalonia.PropertyGrid.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/DemaConsulting.Plexus.Avalonia.PropertyGrid.md"
              min: 1
              max: 1
              text:
                - contains: "SelectedObject = new Mixer()"
                - contains: "PropertyEditSession"
            - pattern: "api/DemaConsulting.Plexus.Avalonia.PropertyGrid/Plexus.md"
              min: 1
              max: 1
              text:
                - contains: "NodePropertySource"

  - name: ApiMark_ExampleCodeRendered
    description: "Documented examples render as fenced code blocks on type and member pages"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus/bin/Release/DemaConsulting.Plexus.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/DemaConsulting.Plexus/DiagramPage.md"
              min: 1
              max: 1
              text:
                - matches: "(?s)```csharp.*page\\.AddNode.*```"
            - pattern: "api/DemaConsulting.Plexus/UndoHistory.md"
              min: 1
              max: 1
              text:
                - matches: "(?s)```csharp.*BeginTransaction.*```"
            - pattern: "api/DemaConsulting.Plexus/ConnectionRules.md"
              min: 1
              max: 1
              text:
                - matches: "(?s)```csharp.*ConnectionRules\\.All.*```"
            - pattern: "api/DemaConsulting.Plexus/Diagram/ToJson.md"
              min: 1
              max: 1
              text:
                - matches: "(?s)```csharp.*ToJson.*```"

  - name: ApiMark_RenderingMembersDocumented
    description: "Documentation-coverage enforcement is active for the Rendering package"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus.Rendering/bin/Release/DemaConsulting.Plexus.Rendering.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/DemaConsulting.Plexus.Rendering/RenderOptions/RenderOptions.md"
              min: 1
              max: 1
              text:
                - contains: "Initializes a new instance of the"
                - does-not-contain: "No description provided"

  - name: ApiMark_AvaloniaMembersDocumented
    description: "Documentation-coverage enforcement is active for the Avalonia package"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus.Avalonia/bin/Release/DemaConsulting.Plexus.Avalonia.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/DemaConsulting.Plexus.Avalonia/DiagramEditor/Render.md"
              min: 1
              max: 1
              text:
                - contains: "Draws the visible part of the diagram"
            - pattern: "api/DemaConsulting.Plexus.Avalonia/NodePalette/Render.md"
              min: 1
              max: 1
              text:
                - contains: "Draws the palette entries"

  - name: ApiMark_PropertyGridMembersDocumented
    description: "Documentation-coverage enforcement is active for the PropertyGrid package"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Plexus.Avalonia.PropertyGrid/bin/Release/\
          DemaConsulting.Plexus.Avalonia.PropertyGrid.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/DemaConsulting.Plexus.Avalonia.PropertyGrid/PropertyGrid/PropertyGrid.md"
              min: 1
              max: 1
              text:
                - contains: "Initializes a new instance of the"
                - does-not-contain: "No description provided"
            - pattern: "api/DemaConsulting.Plexus.Avalonia.PropertyGrid/PropertyGrid/Refresh.md"
              min: 1
              max: 1
              text:
                - contains: "Re-reads the source's items and values"
            - pattern: "api/DemaConsulting.Plexus.Avalonia.PropertyGrid/PropertyEditSession/Commit.md"
              min: 1
              max: 1
              text:
                - contains: "Writes the pending edits to the target"

  # --- BUILD NOTES ---

  - name: Pandoc_BuildNotesHtml
    description: "Build Notes HTML was generated by Pandoc"
    tags: [build-notes]
    files:
      - pattern: "docs/build_notes/generated/build_notes.html"
        count: 1
