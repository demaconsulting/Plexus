          - query: "//head/title"
            count: 1
        text:
          - contains: "Build Notes"

  - name: WeasyPrint_BuildNotesPdf
    description: "Build Notes PDF was generated by WeasyPrint"
    tags: [build-notes]
    files:
      - pattern: "docs/generated/Plexus Build Notes.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "Plexus"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Build notes"
          pages:
            min: 1
          text:
            - contains: "Build Notes"

