<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. Node types are dragged from the node palette onto the Avalonia editor canvas, where
       blocks with typed ports are joined by routed wires, selected, and undone with Ctrl+Z. The Plexus .NET library
       keeps the result as the diagram model (pages, nodes, typed ports, and routed wires) and produces PNG images
       from its headless renderer, saved JSON snapshots, and versioned JSON for the clipboard.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 36px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>


  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <!-- "Plexus" is one word, so it is split at its syllable boundary, Plex|us: "Plex" (2057 units) is the root
       that means braided or interwoven, and the gradient tail "us" starts at x = 52 + 0.092 * 2057 = 241.2 -->
  <text class="word" x="52" y="176">Plex</text>
  <text class="word brandText" x="241.2" y="176">us</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">A block diagram editor</text>
  <text class="tag" x="56" y="314" style="fill: #a5b4fc">and model for .NET.</text>
  <text class="body" x="58" y="368">Typed ports, routed wires, groups</text>
  <text class="body" x="58" y="402">and pages with undo and redo; an</text>
  <text class="body" x="58" y="436">Avalonia control and PNG renderer.</text>
  <!-- The command box: two C# calls from the Quick Start, on two lines -->
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd" x="78" y="503">page.Connect(</text>
  <text class="cmd file" x="273" y="503">"A.out"</text>
  <text class="cmd" x="378" y="503">,</text>
  <text class="cmd file" x="408" y="503">"B.in"</text>
  <text class="cmd" x="498" y="503">);</text>
  <text class="cmd" x="78" y="539">diagram.History.Undo();</text>
  <text class="note" x="58" y="604">Core .NET 8 to 11 &#183; MIT license</text>

  <!-- Input cards: the node palette and the editor canvas it drops onto -->
  <g>
    <!-- Input one: the node palette, listing node types with their typed ports -->
    <rect class="card" x="580" y="40" width="236" height="160" rx="16"/>
    <rect x="642" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="220" height="112" rx="10"/>
    <rect x="602" y="56" width="192" height="28" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text class="mini" x="698" y="78" fill="#fde68a" text-anchor="middle">Pump</text>
    <circle cx="794" cy="70" r="5" fill="#fbbf24" stroke="#0a1022" stroke-width="2"/>
    <rect x="602" y="90" width="192" height="28" rx="6" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="2"/>
    <text class="mini" x="698" y="112" fill="#a5f3fc" text-anchor="middle">Valve</text>
    <circle cx="602" cy="104" r="5" fill="#fbbf24" stroke="#0a1022" stroke-width="2"/>
    <circle cx="794" cy="104" r="5" fill="#22d3ee" stroke="#0a1022" stroke-width="2"/>
    <rect x="602" y="124" width="192" height="28" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text class="mini" x="698" y="146" fill="#ddd6fe" text-anchor="middle">Tank</text>
    <circle cx="602" cy="138" r="5" fill="#22d3ee" stroke="#0a1022" stroke-width="2"/>
    <text class="label" x="698" y="190">Node palette</text>

    <!-- Input two: the Avalonia editor canvas: a dragged node's ghost, routed wires, a selection, and undo -->
    <rect class="card" x="828" y="40" width="732" height="160" rx="16"/>
    <rect x="1138" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="836" y="48" width="716" height="112" rx="10"/>
    <rect x="860" y="96" width="104" height="40" rx="7" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="mini" x="904" y="124" fill="#a5f3fc" fill-opacity="0.8" text-anchor="middle">Valve</text>
    <path d="M944 120 L944 148 L951 141 L956 153 L961 151 L956 139 L965 139 Z" fill="#ffffff" stroke="#0a1022" stroke-width="1.5"/>
    <path d="M1104 78 L1128 78 L1128 124 L1152 124" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <path d="M1256 124 L1284 124 L1284 78 L1314 78" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <rect x="1000" y="58" width="104" height="40" rx="7" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text class="mini" x="1052" y="86" fill="#fde68a" text-anchor="middle">Pump</text>
    <circle cx="1104" cy="78" r="6" fill="#fbbf24" stroke="#0a1022" stroke-width="2"/>
    <rect x="1152" y="104" width="104" height="40" rx="7" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text class="mini" x="1204" y="132" fill="#a5f3fc" text-anchor="middle">Valve</text>
    <circle cx="1152" cy="124" r="6" fill="#fbbf24" stroke="#0a1022" stroke-width="2"/>
    <circle cx="1256" cy="124" r="6" fill="#22d3ee" stroke="#0a1022" stroke-width="2"/>
    <rect x="1314" y="58" width="104" height="40" rx="7" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text class="mini" x="1366" y="86" fill="#ddd6fe" text-anchor="middle">Tank</text>
    <circle cx="1314" cy="78" r="6" fill="#22d3ee" stroke="#0a1022" stroke-width="2"/>
    <rect x="1304" y="53" width="124" height="50" rx="4" fill="none" stroke="#f8fafc" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <g fill="#f8fafc">
      <rect x="1300" y="49" width="8" height="8"/>
      <rect x="1424" y="49" width="8" height="8"/>
      <rect x="1300" y="99" width="8" height="8"/>
      <rect x="1424" y="99" width="8" height="8"/>
    </g>
    <rect x="1440" y="114" width="100" height="36" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1490" y="139" fill="#e2e8f0" text-anchor="middle">Ctrl+Z</text>
    <text class="label" x="1194" y="190">Avalonia editor: drag, wire, select, undo</text>
  </g>
  <!-- The drag from the palette's Valve entry to its ghost on the canvas -->
  <path d="M800 104 C828 104 832 116 858 116" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="5 5"/>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M698,206 C698,236 1000,226 1000,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M1194,206 C1194,236 1140,226 1140,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="698" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="1194" cy="206" r="5" fill="#22d3ee"/>
  </g>
  <!-- The engine: the Plexus library, with a two-node diagram glyph -->
  <rect x="860" y="262" width="420" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="860" y="262" width="420" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="884" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <rect x="889" y="281" width="12" height="10" rx="2" fill="#ffffff"/>
  <rect x="903" y="297" width="12" height="10" rx="2" fill="#ffffff"/>
  <path d="M901 286 L908 286 L908 297" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text class="engine" x="936" y="305">Plexus</text>
  <line x1="1063" y1="278" x2="1063" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1083" y="303">.NET library</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Output one: the diagram model, a page with two nodes joined by a routed wire -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <rect x="600" y="406" width="76" height="30" rx="7" fill="#a78bfa" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.5"/>
    <text class="mini" x="638" y="428" fill="#ede9fe" text-anchor="middle">Main</text>
    <rect x="684" y="406" width="54" height="30" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text class="mini" x="711" y="428" fill="#94a3b8" text-anchor="middle">P2</text>
    <path d="M706 474 L740 474 L740 512 L762 512" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <rect x="610" y="448" width="96" height="58" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text class="mini" x="658" y="484" fill="#fde68a" text-anchor="middle">Pump</text>
    <rect x="762" y="484" width="96" height="58" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text class="mini" x="810" y="520" fill="#a5f3fc" text-anchor="middle">Valve</text>
    <circle cx="706" cy="474" r="6" fill="#fbbf24" stroke="#0a1022" stroke-width="2"/>
    <circle cx="762" cy="512" r="6" fill="#fbbf24" stroke="#0a1022" stroke-width="2"/>
    <text class="label" x="728" y="585">Diagram model</text>

    <!-- Output two: a PNG image from the headless renderer -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <path class="page" d="M952 408 L1034 408 L1050 424 L1050 542 L952 542 Z"/>
    <path d="M1034 408 L1034 424 L1050 424 Z" fill="#cbd5e1"/>
    <path d="M998 436 L1012 436 L1012 472 L1004 472" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="962" y="424" width="36" height="24" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <rect x="1004" y="460" width="36" height="24" rx="4" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="970" y="500" width="62" height="30" rx="7" fill="#db2777" fill-opacity="0.14" stroke="#db2777" stroke-width="1.5"/>
    <text class="mini" x="1001" y="522" fill="#be185d" text-anchor="middle">png</text>
    <text class="label" x="999" y="585">PNG render</text>

    <!-- Output three: a saved JSON snapshot of the diagram -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <circle cx="1232" cy="448" r="24" fill="url(#brand)"/>
    <path d="M1222 434 L1237 434 L1244 441 L1244 462 L1222 462 Z" fill="#ffffff"/>
    <rect x="1146" y="494" width="172" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1232" y="520" fill="#e2e8f0" text-anchor="middle">diagram.json</text>
    <text class="label" x="1232" y="585">Saved JSON</text>

    <!-- Output four: copied nodes and wires as versioned JSON on the clipboard -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <g transform="translate(1347 418)">
      <rect class="page" x="60" y="14" width="100" height="108" rx="8"/>
      <rect x="88" y="7" width="44" height="16" rx="5" fill="#60a5fa"/>
      <rect x="74" y="40" width="30" height="22" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <rect x="116" y="76" width="30" height="22" rx="4" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/>
      <path d="M104 51 L111 51 L111 87 L116 87" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    </g>
    <text class="label" x="1457" y="585">Clipboard</text>
  </g>
</svg>