<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="880" height="591" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="880" height="591" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(40,32)">
    <!-- Host application -->
    <rect x="250" y="0" width="320" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="410" y="28" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">Your application</text>
    <text x="410" y="48" font-size="13" fill="#92400e" text-anchor="middle">owns the node types; uses the packages it needs</text>
    <path d="M300,66 V88 H125 V106" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <path d="M410,66 V106" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <path d="M520,66 V88 H695 V106" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Rendering package -->
    <rect x="0" y="110" width="250" height="186" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="140" font-size="15" font-family="Consolas, monospace" font-weight="600" fill="#1e3a8a" text-anchor="middle">.Rendering</text>
    <text x="125" y="164" font-size="13" fill="#1e40af" text-anchor="middle">Headless renderer</text>
    <text x="125" y="184" font-size="13" fill="#1e40af" text-anchor="middle">Paints a page to a PNG image</text>
    <text x="125" y="204" font-size="13" fill="#1e40af" text-anchor="middle">with no UI framework</text>
    <text x="125" y="238" font-size="12" fill="#334155" text-anchor="middle">built on</text>
    <rect x="55" y="248" width="140" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="125" y="269" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">CanvasNet</text>

    <!-- Avalonia editor package -->
    <rect x="285" y="110" width="250" height="186" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="410" y="140" font-size="15" font-family="Consolas, monospace" font-weight="600" fill="#1e3a8a" text-anchor="middle">.Avalonia</text>
    <text x="410" y="164" font-size="13" fill="#1e40af" text-anchor="middle">Editor control and node palette</text>
    <text x="410" y="184" font-size="13" fill="#1e40af" text-anchor="middle">Select, move, connect, zoom,</text>
    <text x="410" y="204" font-size="13" fill="#1e40af" text-anchor="middle">rename, drag and drop, clipboard</text>
    <text x="410" y="238" font-size="12" fill="#334155" text-anchor="middle">built on</text>
    <rect x="335" y="248" width="150" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="410" y="269" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Avalonia</text>

    <!-- Property grid package -->
    <rect x="570" y="110" width="250" height="186" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="695" y="140" font-size="15" font-family="Consolas, monospace" font-weight="600" fill="#1e3a8a" text-anchor="middle">.Avalonia.PropertyGrid</text>
    <text x="695" y="164" font-size="13" fill="#1e40af" text-anchor="middle">Property grid and node dialog</text>
    <text x="695" y="184" font-size="13" fill="#1e40af" text-anchor="middle">Edits any annotated object,</text>
    <text x="695" y="204" font-size="13" fill="#1e40af" text-anchor="middle">with undo-aware edit sessions</text>
    <text x="695" y="238" font-size="12" fill="#334155" text-anchor="middle">built on</text>
    <rect x="620" y="248" width="150" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="695" y="269" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Avalonia</text>

    <!-- Packages depend on the core -->
    <line x1="125" y1="300" x2="125" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="410" y1="300" x2="410" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <line x1="695" y1="300" x2="695" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="137" y="331" font-size="12" fill="#334155">depends on the core</text>
    <text x="422" y="331" font-size="12" fill="#334155">depends on the core</text>
    <text x="707" y="331" font-size="12" fill="#334155">depends on the core</text>

    <!-- Core -->
    <rect x="0" y="358" width="820" height="188" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="410" y="386" font-size="16" font-family="Consolas, monospace" font-weight="600" fill="#166534" text-anchor="middle">DemaConsulting.Plexus</text>
    <text x="410" y="405" font-size="13" fill="#166534" text-anchor="middle">UI-free core, targets .NET 8, 9 and 10</text>
    <rect x="20" y="420" width="250" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="145" y="441" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Model</text>
    <text x="145" y="459" font-size="12" fill="#166534" text-anchor="middle">pages, nodes, wires, groups, notes</text>
    <rect x="285" y="420" width="250" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="410" y="441" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Undo history</text>
    <text x="410" y="459" font-size="12" fill="#166534" text-anchor="middle">transactions, undo and redo</text>
    <rect x="550" y="420" width="250" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="675" y="441" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Node types and properties</text>
    <text x="675" y="459" font-size="12" fill="#166534" text-anchor="middle">typed ports, icons, host data</text>
    <rect x="20" y="484" width="250" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="145" y="505" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Wire routing</text>
    <text x="145" y="523" font-size="12" fill="#166534" text-anchor="middle">orthogonal, obstacle-avoiding</text>
    <rect x="285" y="484" width="250" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="410" y="505" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Scene</text>
    <text x="410" y="523" font-size="12" fill="#166534" text-anchor="middle">theme, layout, drawable page</text>
    <rect x="550" y="484" width="250" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="675" y="505" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Serialization</text>
    <text x="675" y="523" font-size="12" fill="#166534" text-anchor="middle">JSON snapshot, clipboard</text>
  </g>
</svg>
