---
# PlexusAvalonia platform requirements.
#
# These requirements specify the platforms and runtime the DemaConsulting.Plexus.Avalonia package must support.
# Source filters (windows@, ubuntu@, macos@, net10.0@) restrict which test results count as evidence for each
# requirement; removing them invalidates the evidence-based proof.

sections:
  - title: PlexusAvalonia Requirements
    sections:
      - title: Platform Support
        requirements:
          - id: PlexusAvalonia-Platform-Windows
            title: The system shall build and run on Windows platforms.
            tags: [system]
            justification: |
              Windows is a major desktop platform for diagram editing applications.
            tests:
              - "windows@PlexusAvalonia_EditingSession_ConnectRenderAndUndo_WorksOnThisPlatform"

          - id: PlexusAvalonia-Platform-Linux
            title: The system shall build and run on Linux platforms.
            tags: [system]
            justification: |
              Linux desktops and display-less CI agents must be able to host and test the editor.
            tests:
              - "ubuntu@PlexusAvalonia_EditingSession_ConnectRenderAndUndo_WorksOnThisPlatform"

          - id: PlexusAvalonia-Platform-MacOS
            title: The system shall build and run on macOS platforms.
            tags: [system]
            justification: |
              Applications built on Avalonia are commonly delivered to macOS users as well.
            tests:
              - "macos@PlexusAvalonia_EditingSession_ConnectRenderAndUndo_WorksOnThisPlatform"

          - id: PlexusAvalonia-Platform-Net10
            title: The system shall support the .NET 10 runtime.
            tags: [system]
            justification: |
              The Avalonia package targets .NET 10, the current long-term support runtime.
            tests:
              - "net10.0@PlexusAvalonia_EditingSession_ConnectRenderAndUndo_WorksOnThisPlatform"
