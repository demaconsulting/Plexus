---
# Software Subsystem requirements for PlexusAvalonia Editor.
#
# Decomposes the PlexusAvalonia system requirements into the responsibility of the Editor subsystem: the control,
# its pointer gestures, the clipboard bridge and the node type drag helper working together. Tests are the
# subsystem-level tests in EditorTests.cs; the requirements decompose further into the unit requirements below.

sections:
  - title: PlexusAvalonia Requirements
    sections:
      - title: Editor Requirements
        requirements:
          - id: PlexusAvalonia-Editor-SceneSync
            title: >-
              The editor shall keep what it draws, what hit testing finds and what the diagram theme and view
              (zoom and scroll) say consistent with the shown page, rebuilding its picture when the diagram changes.
            justification: |
              Decomposes PlexusAvalonia-Display; painting, hit testing and gestures must all work from the same
              current picture of the page, or users would act on elements that are not where they appear.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-Defaults
              - PlexusAvalonia-Editor-DiagramEditor-ViewTransform
              - PlexusAvalonia-Editor-DiagramEditor-SceneRefresh
              - PlexusAvalonia-Editor-DiagramEditor-Painting
              - PlexusAvalonia-Editor-DiagramEditor-SelectionHygiene
              - PlexusAvalonia-Editor-DiagramEditor-PageFollow
              - PlexusAvalonia-Editor-DiagramClipboard-TextFormatting
            tests:
              - Editor_SceneSync_ModelThemeAndViewChanges_KeepSceneAndHitTestingConsistent

          - id: PlexusAvalonia-Editor-PointerEditing
            title: >-
              The editor shall turn pointer input on the shown page into selection, move, duplicate, connect, wire
              segment, annotation resize, group toggle and view navigation actions through its gestures, each drag
              recorded as one undo step and view navigation recording none.
            justification: |
              Decomposes PlexusAvalonia-Selection, -Move, -Connect, -WireReshape, -Annotation, -GroupToggle and
              -Navigation; the control routes each press to the right gesture and the gestures edit the model.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-Selection
              - PlexusAvalonia-Editor-DiagramEditor-RubberBand
              - PlexusAvalonia-Editor-DiagramEditor-DragMove
              - PlexusAvalonia-Editor-DiagramEditor-CtrlDrag
              - PlexusAvalonia-Editor-DiagramEditor-Connect
              - PlexusAvalonia-Editor-DiagramEditor-WireSegment
              - PlexusAvalonia-Editor-DiagramEditor-AnnotationResize
              - PlexusAvalonia-Editor-DiagramEditor-GroupToggle
              - PlexusAvalonia-Editor-DiagramEditor-Navigation
              - PlexusAvalonia-Editor-Gestures-Move
              - PlexusAvalonia-Editor-Gestures-Duplicate
              - PlexusAvalonia-Editor-Gestures-DeferredSelection
              - PlexusAvalonia-Editor-Gestures-Connect
              - PlexusAvalonia-Editor-Gestures-ConnectValidation
              - PlexusAvalonia-Editor-Gestures-Resize
              - PlexusAvalonia-Editor-Gestures-ResizeMinimum
              - PlexusAvalonia-Editor-Gestures-WireSegmentLimits
              - PlexusAvalonia-Editor-Gestures-WireSegmentMove
              - PlexusAvalonia-Editor-Gestures-Pan
              - PlexusAvalonia-Editor-Gestures-RubberBand
              - PlexusAvalonia-Editor-Gestures-RubberBandAdditive
              - PlexusAvalonia-Editor-Gestures-RubberBandGroups
              - PlexusAvalonia-Editor-Gestures-RubberBandNoHistory
            tests:
              - Editor_PointerEditing_SelectMoveConnectResizeBandAndPan_EditModelWithOneUndoStepEach

          - id: PlexusAvalonia-Editor-WireEditing
            title: >-
              The editor shall let the user reshape a selected wire through its bend handles, port stubs and
              double-click jogs and re-attach its ends by dragging the end handles, through its gestures and
              hit testing, each edit recorded as one undo step and each rejected drop recording none.
            justification: |
              Decomposes PlexusAvalonia-WireEditing; the control routes presses on wire handles and segments to
              the wire gestures, which edit the model through the wire API.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-WireHandles
              - PlexusAvalonia-Editor-DiagramEditor-WireBend
              - PlexusAvalonia-Editor-DiagramEditor-WireJog
              - PlexusAvalonia-Editor-DiagramEditor-WireEnds
              - PlexusAvalonia-Editor-Gestures-WireBend
              - PlexusAvalonia-Editor-Gestures-WireEndReconnect
            tests:
              - PlexusAvalonia_WireEditing_BendStubJogAndEndpoint_AreSingleUndoEntries

          - id: PlexusAvalonia-Editor-GestureCancellation
            title: >-
              The editor shall abandon a drag in progress when Escape, Undo, Redo or a page change occurs, restoring
              the diagram and leaving the history unchanged.
            justification: |
              Decomposes PlexusAvalonia-GestureCancellation; the control and the gestures together must guarantee
              that a half-made change never reaches the history.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-GestureCancel
              - PlexusAvalonia-Editor-DiagramEditor-History
              - PlexusAvalonia-Editor-Gestures-MoveCancel
              - PlexusAvalonia-Editor-Gestures-ConnectCancel
              - PlexusAvalonia-Editor-Gestures-ResizeCancel
              - PlexusAvalonia-Editor-Gestures-WireSegmentCancel
            tests:
              - Editor_GestureInFlight_EscapeUndoRedoAndPageChange_CancelWithoutHistory

          - id: PlexusAvalonia-Editor-InlineEditing
            title: >-
              The editor shall offer one inline editor at a time, for a node name or an annotation text, that
              commits or cancels through shared commands, with name rejections reported to the user.
            justification: |
              Decomposes PlexusAvalonia-Rename and the text editing part of PlexusAvalonia-Annotation; both inline
              editors must behave alike so that commit, cancel and outside clicks are predictable.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-Rename
              - PlexusAvalonia-Editor-DiagramEditor-AnnotationEdit
              - PlexusAvalonia-Editor-DiagramEditor-EditLifecycle
            tests:
              - Editor_InlineEditing_RenameAndAnnotation_CommitOrCancel

          - id: PlexusAvalonia-Editor-Clipboard
            title: >-
              The editor shall copy, cut and paste through a clipboard that carries the Plexus format with a text
              fallback, and shall report clipboard failures to the host through events.
            justification: |
              Decomposes PlexusAvalonia-Clipboard; the control (commands, events) and the clipboard bridge (formats)
              together deliver the workflow.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-Clipboard
              - PlexusAvalonia-Editor-DiagramEditor-ClipboardFailures
              - PlexusAvalonia-Editor-DiagramClipboard-WriteBothFormats
              - PlexusAvalonia-Editor-DiagramClipboard-ReadPrefersPlexusFormat
              - PlexusAvalonia-Editor-DiagramClipboard-TextFallback
              - PlexusAvalonia-Editor-DiagramClipboard-EmptyClipboard
            tests:
              - Editor_Clipboard_CopyCutPasteAndFailures_GoThroughBridgeAndRaiseEvents

          - id: PlexusAvalonia-Editor-NodeDrop
            title: >-
              The editor shall create a node for a dropped node type payload and shall provide a helper that makes a
              control start such drags.
            justification: |
              Decomposes PlexusAvalonia-NodeDrop; the drag source helper and the drop target must agree on the
              payload.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-NodeDrop
              - PlexusAvalonia-Editor-NodeTypeDragSource-StartsDrag
              - PlexusAvalonia-Editor-NodeTypeDragSource-Abandon
              - PlexusAvalonia-Editor-NodeTypeDragSource-LeftButtonOnly
              - PlexusAvalonia-Editor-NodeTypeDragSource-Dispose
              - PlexusAvalonia-Editor-NodeTypeDragSource-PlatformFailure
            tests:
              - Editor_NodeDrop_PayloadDroppedOnEditor_CreatesSelectedNodeAndIgnoresUnknownTypes

          - id: PlexusAvalonia-Editor-NodePalette
            title: >-
              The editor subsystem shall provide a node palette whose items look exactly like freshly added nodes on
              the canvas, that can be filtered, grouped, selected, activated and dragged onto the editor, and the editor
              shall show a ghost of the dragged node at the snapped drop position so that the node lands exactly where
              the ghost was.
            justification: |
              Decomposes PlexusAvalonia-NodePalette; the palette, the drag payload and the drop target must agree on
              what is created and where, and the user sees the result before releasing.
            children:
              - PlexusAvalonia-Editor-NodePalette-Items
              - PlexusAvalonia-Editor-NodePalette-LooksLikeCanvas
              - PlexusAvalonia-Editor-NodePalette-BoxColumn
              - PlexusAvalonia-Editor-NodePalette-Columns
              - PlexusAvalonia-Editor-NodePalette-FilterAndGroups
              - PlexusAvalonia-Editor-NodePalette-SelectAndActivate
              - PlexusAvalonia-Editor-NodePalette-FollowsEditor
              - PlexusAvalonia-Editor-NodePalette-ActivateAddsNode
              - PlexusAvalonia-Editor-NodePalette-RevealAndInvoke
              - PlexusAvalonia-Editor-NodePalette-SearchBox
              - PlexusAvalonia-Editor-DiagramEditor-AddNodeAtCenter
              - PlexusAvalonia-Editor-DiagramEditor-SelectionCommands
              - PlexusAvalonia-Editor-DiagramEditor-ViewCommands
              - PlexusAvalonia-Editor-NodePalette-Drag
              - PlexusAvalonia-Editor-NodePalette-SceneCache
              - PlexusAvalonia-Editor-DiagramEditor-DropGhost
            tests:
              - Editor_NodePalette_DragItemOverEditor_ShowsGhostAndDropsNodeWhereGhostWas

          - id: PlexusAvalonia-Editor-HostIntegration
            title: >-
              The editor shall raise events for node double-clicks and context requests, and shall refuse every
              editing action while read-only.
            justification: |
              Decomposes PlexusAvalonia-HostEvents and PlexusAvalonia-ReadOnly; the host drives dialogs, menus and
              the editing policy through this surface.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-HostEvents
              - PlexusAvalonia-Editor-DiagramEditor-ReadOnly
            tests:
              - Editor_HostIntegration_EventsAndReadOnly_AreRaisedAndRespected

          - id: PlexusAvalonia-Editor-Keyboard
            title: >-
              The editor shall run delete, undo, redo, select-all, duplicate and rename from keyboard shortcuts,
              except while an inline editor is open, which owns the keyboard.
            justification: |
              Decomposes PlexusAvalonia-Keyboard and the select-all part of PlexusAvalonia-Selection; typing into an
              inline editor must never trigger diagram commands.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-Keyboard
              - PlexusAvalonia-Editor-DiagramEditor-Delete
              - PlexusAvalonia-Editor-DiagramEditor-Duplicate
            tests:
              - Editor_Keyboard_Shortcuts_RunCommandsUnlessInlineEditorIsOpen

          - id: PlexusAvalonia-Editor-ToolTips
            title: >-
              The editor shall give the hovered node, port or wire a tooltip.
            justification: |
              Decomposes PlexusAvalonia-ToolTips; the editor knows what the pointer is over.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipDisplay
            tests:
              - Editor_ToolTips_HoverNodePortAndWire_ShowDefaultOrHostContent

          - id: PlexusAvalonia-Editor-ToolTipDefaults
            title: >-
              The editor shall build the default tooltip of a port from its label, its type's display name and its
              description, that of a node from its node type, and that of a wire from its source and target, and give
              annotations and groups none.
            justification: |
              Decomposes PlexusAvalonia-ToolTipDefaults; the editor resolves the diagram's port types and node types.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipContent
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipNodeContent
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipWireContent
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipOtherContent
            tests:
              - Editor_ToolTips_HoverNodePortAndWire_ShowDefaultOrHostContent

          - id: PlexusAvalonia-Editor-ToolTipHostContent
            title: >-
              The editor shall raise an event with the default tooltip content that lets the host replace it.
            justification: |
              Decomposes PlexusAvalonia-ToolTipHostContent; the editor owns the moment the tooltip is requested.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipRequested
            tests:
              - Editor_ToolTips_HoverNodePortAndWire_ShowDefaultOrHostContent

          - id: PlexusAvalonia-Editor-ToolTipHostCancel
            title: >-
              The editor shall show no tooltip for an element or port whose request the host canceled or left with
              null or empty content.
            justification: |
              Decomposes PlexusAvalonia-ToolTipHostCancel; the editor decides what it sets on its own control.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipRequested
            tests:
              - Editor_ToolTips_HostCancels_ShowsNoTip

          - id: PlexusAvalonia-Editor-ToolTipDisable
            title: >-
              While tooltips are turned off the editor shall set no tooltip and raise no tooltip request when the
              pointer hovers.
            justification: |
              Decomposes PlexusAvalonia-ToolTipDisable; the editor reacts to the pointer and to its own setting.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-ShowToolTips
            tests:
              - Editor_ToolTips_Disabled_ShowsNoTipAndRaisesNoEvent

          - id: PlexusAvalonia-Editor-ToolTipHiding
            title: >-
              The editor shall clear the tooltip when a mouse button is pressed, while a drag, connection or inline
              edit is under way, and when the pointer leaves.
            justification: |
              Decomposes PlexusAvalonia-ToolTipHiding; the editor knows when a gesture or inline edit runs.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipClear
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipPressSuppression
              - PlexusAvalonia-Editor-DiagramEditor-ToolTipGestureHiding
            tests:
              - Editor_ToolTips_PressExitAndInlineEdit_HideTip

          - id: PlexusAvalonia-Editor-ElementNavigation
            title: >-
              The editor shall bring an element into view, switching to its page and showing the collapsed group that
              hides it.
            justification: |
              Decomposes PlexusAvalonia-ElementNavigation; the view state (page, zoom, offset) is the editor's.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-BringIntoView
              - PlexusAvalonia-Editor-DiagramEditor-BringIntoViewPage
              - PlexusAvalonia-Editor-DiagramEditor-BringIntoViewCollapsed
            tests:
              - Editor_ElementNavigation_BringIntoViewAndFitElements_ShowElementsAcrossPages

          - id: PlexusAvalonia-Editor-FitElements
            title: >-
              The editor shall fit a set of elements into the view.
            justification: |
              Decomposes PlexusAvalonia-FitElements; zoom to selection and search results need the editor's view
              state.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-ZoomToFitElements
              - PlexusAvalonia-Editor-DiagramEditor-ZoomToFitElementsCollapsed
              - PlexusAvalonia-Editor-DiagramEditor-ZoomToFitElementsPages
            tests:
              - Editor_ElementNavigation_BringIntoViewAndFitElements_ShowElementsAcrossPages

          - id: PlexusAvalonia-Editor-NavigationDeferred
            title: >-
              A navigation request made before the editor has its first layout shall wait and be applied once the
              editor has a size, and the latest request shall win.
            justification: |
              Decomposes PlexusAvalonia-ElementNavigation; hosts call navigation from window constructors, before any
              size exists.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-BringIntoViewDeferred
              - PlexusAvalonia-Editor-DiagramEditor-ZoomToFitElementsDeferred
              - PlexusAvalonia-Editor-DiagramEditor-ViewRequestOrder
            tests:
              - Editor_ElementNavigation_BeforeFirstLayout_AppliesLatestRequest

          - id: PlexusAvalonia-Editor-NavigationInvalid
            title: >-
              An empty set, a null or detached element, an element of another diagram and an invalid margin shall
              leave the page, zoom, offset and selection unchanged.
            justification: |
              Decomposes PlexusAvalonia-ElementNavigation; a refused request must never leave the view half changed.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-BringIntoViewInvalid
              - PlexusAvalonia-Editor-DiagramEditor-ZoomToFitElementsInvalid
              - PlexusAvalonia-Editor-DiagramEditor-ZoomToFitElementsEmpty
            tests:
              - Editor_ElementNavigation_InvalidOrEmptyRequests_LeaveViewUnchanged

          - id: PlexusAvalonia-Editor-DynamicPorts
            title: >-
              The editor shall connect a dragged wire to a port that a configuration change added.
            justification: |
              Decomposes PlexusAvalonia-DynamicPortConnect; the editor must follow the model's port changes like any
              other change.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-DynamicPorts
            tests:
              - Editor_DynamicPorts_PropertyChange_SceneHitTestAndConnectFollow

          - id: PlexusAvalonia-Editor-DynamicPortRemoved
            title: >-
              The editor shall no longer hit a port that a configuration change removed, and shall hit it again after
              the change is undone.
            justification: |
              Decomposes PlexusAvalonia-DynamicPorts; gestures must act on the ports the node has now.
            children:
              - PlexusAvalonia-Editor-DiagramEditor-DynamicPortRemoved
            tests:
              - Editor_DynamicPorts_RemovedPort_IsNotHit
