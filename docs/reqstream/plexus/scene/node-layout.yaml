---
# Software Unit requirements for Plexus NodeLayout.
#
# Unit requirements decompose the Scene subsystem requirements (which link down to these IDs as children) and are
# proven by the unit tests in NodeLayoutTests.

sections:
  - title: Plexus Requirements
    sections:
      - title: Scene Requirements
        sections:
          - title: NodeLayout Requirements
            requirements:
              - id: Plexus-Scene-NodeLayout-PortAnchorsMatchModel
                title: >-
                  The layout shall place every port's wire attachment point exactly at the anchor that the model
                  and the shared geometry functions give for that port.
                justification: |
                  Wires are routed against the model's anchors; a layout that moved them would detach wires from
                  their ports.
                tests:
                  - NodeLayout_Compute_PortAnchors_MatchModelAndNodeGeometry
                  - NodeLayout_Compute_OtherThemeWithChangedPortMetrics_KeepsModelAnchors

              - id: Plexus-Scene-NodeLayout-GeometryTheme
                title: >-
                  The layout shall compute port rows, anchors, triangles and hit areas from the node's own diagram
                  theme, whatever theme it is given for colors, fonts and decorations.
                justification: |
                  Decomposes Plexus-Scene-GeometryTheme; the model routes wires to anchors computed with the diagram's
                  theme, so a display theme that moved the ports would detach the drawn ports from the wire ends.
                tests:
                  - NodeLayout_Compute_OtherThemeWithChangedPortMetrics_KeepsModelAnchors

              - id: Plexus-Scene-NodeLayout-PortAnchorsTextIndependent
                title: The port attachment points shall be the same whichever text measurer computes the layout.
                justification: |
                  Painters supply their own measurers; the anchors must not vary with them.
                tests:
                  - NodeLayout_Compute_PortAnchors_AreTextIndependent

              - id: Plexus-Scene-NodeLayout-PortGeometry
                title: >-
                  The layout shall place each port's triangle against the node edge at the port's row, its label
                  beside the triangle centered on the row, and its hit area from just inside the edge out to the
                  anchor.
                justification: |
                  Triangle, label and hit area together are what the user sees and points at; they must be
                  consistent with each other.
                tests:
                  - NodeLayout_Compute_PortLabels_AreBesideTheTrianglesCenteredOnTheRow
                  - NodeLayout_Compute_PortTrianglesAndHitAreas_SitAtTheAnchors

              - id: Plexus-Scene-NodeLayout-CenteredPorts
                title: >-
                  With centered port alignment (the default) the inputs and the outputs of a node shall each form a
                  stack, one port pitch apart, that is vertically centered on the node box.
                justification: |
                  Ports centered on the box look balanced and keep wires between aligned nodes straight.
                tests:
                  - NodeGeometry_PortEdge_Center_OddCountPutsMiddlePortOnTheBoxCenter
                  - NodeGeometry_PortEdge_Center_EvenCountStraddlesTheBoxCenter
                  - NodeGeometry_PortEdge_Center_FollowsTheBoxHeight

              - id: Plexus-Scene-NodeLayout-CenteredPortRows
                title: >-
                  With centered port alignment the layout shall place each port's triangle, label and hit area on the
                  row of its anchor.
                justification: |
                  Decomposes Plexus-Scene-PortPlacement; everything drawn and hit for a port must line up with the
                  point its wire attaches to.
                tests:
                  - NodeLayout_Compute_Center_StacksAreSymmetricAboutTheBoxCenter

              - id: Plexus-Scene-NodeLayout-CenteredPortHeight
                title: >-
                  With centered port alignment the default node height shall keep the topmost anchor of the longer
                  stack at least the header height plus the first-port offset below the box top and the bottommost
                  anchor at least the bottom padding above the box bottom.
                justification: |
                  Decomposes Plexus-Scene-PortPlacement; growing the default height keeps a centered stack from running
                  into the header.
                tests:
                  - NodeGeometry_RequiredHeight_Center_IsTwiceTheHeaderClearancePlusTheSpan
                  - NodeGeometry_DefaultNodeSize_Center_KeepsTheTopPortBelowTheHeader
                  - NodeGeometry_DefaultNodeSize_Center_KeepsMinimumAndHonorsDeclaredSize

              - id: Plexus-Scene-NodeLayout-CenteredPortStraightWires
                title: >-
                  With centered port alignment the wire between two nodes that have the same box height and top and
                  the same number of ports on the connected sides shall be straight.
                justification: |
                  Decomposes Plexus-Scene-PortPlacement; straight wires between aligned blocks are the main benefit of
                  centered ports.
                tests:
                  - DiagramPage_Connect_AlignedNodesWithSamePortCounts_RouteStraight

              - id: Plexus-Scene-NodeLayout-TopPorts
                title: >-
                  With top port alignment each port stack shall start at the first-port offset below the header and
                  run downwards one port pitch apart, and the default node height shall fit the header, the stack and
                  the bottom padding, so that hosts can opt back to that earlier arrangement.
                justification: |
                  Hosts and stored layouts that were designed for the earlier arrangement need a way to keep it.
                tests:
                  - NodeGeometry_PortEdge_Top_StartsBelowTheHeaderRegardlessOfCount
                  - NodeGeometry_RequiredHeight_Top_IsHeaderOffsetSpanAndPadding
                  - NodeLayout_Compute_Top_PortsStartBelowTheHeaderAndMatchTheModel

              - id: Plexus-Scene-NodeLayout-ProxyPortAlignment
                title: >-
                  The proxy ports of a collapsed group shall follow the theme's port alignment: centered on the
                  collapsed box with centered alignment (the box growing to hold them), starting below the title bar
                  with top alignment.
                justification: |
                  Wires of a collapsed group attach like wires of nodes, so its ports must be placed by the same
                  rule.
                tests:
                  - SceneBuilder_Build_CollapsedGroup_ProxyPortsAreCenteredOnTheBox
                  - SceneBuilder_Build_CollapsedGroup_Top_ProxyPortsStartBelowTheTitleBar

              - id: Plexus-Scene-NodeLayout-NodeText
                title: >-
                  The layout shall center the node type title in a header band across the top of the box, the
                  instance name just above the box and the summary lines one below the other beneath the box.
                justification: |
                  A consistent arrangement lets users read any node of any type the same way.
                tests:
                  - NodeLayout_Compute_TitleNameAndSummary_AreArrangedAroundTheBox

              - id: Plexus-Scene-NodeLayout-Icon
                title: >-
                  The layout shall reserve a square icon area centered in the body below the header only when the
                  node type has an icon, shrunk to fit small boxes.
                justification: |
                  Nodes without an icon must not reserve space for one, and icons must not overflow small nodes.
                tests:
                  - NodeLayout_Compute_Icon_IsCenteredInBodyOnlyWhenTypeHasIcon

              - id: Plexus-Scene-NodeLayout-Bounds
                title: >-
                  The layout's overall bounds shall contain everything drawn for the node: the box, the name, the
                  summary lines and the port triangles and labels.
                justification: |
                  Culling and repainting decisions use the bounds; text outside them would be clipped or left
                  stale.
                tests:
                  - NodeLayout_Compute_Bounds_CoverEverythingDrawn

              - id: Plexus-Scene-NodeLayout-TextWrapping
                title: >-
                  Wrapping shall break text at explicit line breaks and at word boundaries so that each line fits
                  the given width, and shall split words that are wider than a line by character.
                justification: |
                  Annotation text must stay inside its box without relying on a painter's text layout.
                tests:
                  - TextWrapper_Wrap_BreaksAtWordsAndSplitsLongWords

              - id: Plexus-Scene-NodeLayout-NullArguments
                title: >-
                  Computing a layout shall throw an argument-null exception when the node, theme or measurer is
                  null.
                justification: |
                  Missing arguments are programming errors that should be reported at the call site.
                tests:
                  - NodeLayout_Compute_NullArguments_ThrowArgumentNullException

              - id: Plexus-Scene-NodeLayout-DefaultWidth
                title: >-
                  The default width of a node type without a declared size shall be at least the theme's default
                  width.
                justification: |
                  A theme sets the minimum size of its boxes so that short titles still give nodes a usable size.
                tests:
                  - NodeGeometry_DefaultNodeSize_ShortTitle_KeepsThemeDefaultWidth
                  - NodeGeometry_DefaultNodeSize_WideThemeMinimumAndNoGrid_AreHonored

              - id: Plexus-Scene-NodeLayout-DefaultWidthTitle
                title: >-
                  The default width of a node type without a declared size shall be wide enough, in whole grid steps,
                  for its title to fit the header on one line when measured by the deterministic text measurer.
                justification: |
                  Decomposes Plexus-Scene-PainterAgnosticPrimitives; a title that wraps in the middle of a word looks
                  like a defect, and measuring with the deterministic measurer keeps the model, routers and painters in
                  agreement.
                tests:
                  - NodeGeometry_DefaultNodeSize_LongTitle_GrowsWidthToFitSnappedToTheGrid
                  - SceneBuilder_Build_LongTitleWithDefaultSize_DrawsTheTitleOnOneLine

              - id: Plexus-Scene-NodeLayout-DeclaredSize
                title: The declared size of a node type shall be used as its default size, even for a long title.
                justification: |
                  Decomposes Plexus-Scene-PainterAgnosticPrimitives; hosts that declare a size know best how their
                  nodes must look.
                tests:
                  - NodeGeometry_DefaultNodeSize_DeclaredSize_WinsOverTheTitle

              - id: Plexus-Scene-NodeLayout-DynamicPorts
                title: >-
                  Node layout shall be computed from the node's current ports rather than its type's declared ports.
                justification: |
                  Nodes of one type may have different ports; drawing must follow each node.
                tests:
                  - NodeLayout_Compute_DynamicPorts_LaysOutCurrentPorts

              - id: Plexus-Scene-NodeLayout-DynamicPortExtent
                title: >-
                  A node's deterministic visual extent shall be computed from the node's current ports.
                justification: |
                  Decomposes Plexus-Scene-DynamicPortExtent; group frames enclose the visual extent, so it must cover
                  the ports the node actually has.
                tests:
                  - NodeGeometry_VisualBoundsAndRoutingObstacles_ProviderPorts_UseNodePorts

              - id: Plexus-Scene-NodeLayout-DynamicPortObstacles
                title: >-
                  A node's routing obstacles shall be computed from the node's current ports.
                justification: |
                  Decomposes Plexus-Scene-DynamicPortObstacles; wires of other nodes must not run across the labels of
                  ports the node actually has.
                tests:
                  - NodeGeometry_VisualBoundsAndRoutingObstacles_ProviderPorts_UseNodePorts

              - id: Plexus-Scene-NodeLayout-VisualExtent
                title: >-
                  A node's deterministic visual extent shall contain, for each port, the triangle and the full line
                  height of the port label from the box edge out to the anchor.
                justification: |
                  Decomposes Plexus-Scene-NodeVisualExtent; group frames enclose the visual extent, and a label taller
                  than its triangle would otherwise stick out of a frame.
                tests:
                  - NodeGeometry_VisualBounds_PortLabelLineHeight_IsContained
                  - NodeGeometry_VisualBounds_LargePortLabelFont_ContainsLabels
