---
# Software Unit requirements for Plexus Node.
#
# The Node unit covers the element base class shared by everything on a page, the node element itself and its
# ports. Requirements describe the observable behavior of nodes: ports and port lookup, bounds, host data,
# visibility, removal and change notification.

sections:
  - title: Plexus Requirements
    sections:
      - title: Model Requirements
        sections:
          - title: Node Requirements
            requirements:
              - id: Plexus-Model-Node-Ports
                title: >-
                  A node shall expose one port per declaration of its node type (or of the ports its type's port
                  provider returns for the node), inputs before outputs, each reporting its owning node, name, label,
                  direction, data type key and row index.
                justification: |
                  Hosts and the connection logic address ports through the node. A stable, ordered port list that
                  carries the declared name, label and type is required to draw, validate and connect ports.
                tests:
                  - Node_Ports_InputsThenOutputs_ReportOwnerDirectionAndIndex
                  - Node_Port_ByName_ReturnsCachedPortWithDefinitionData
                  - PortDefinition_Label_CustomLabelIsExposedOnPort
                  - Port_Anchor_NodeMoved_AnchorFollowsNode

              - id: Plexus-Model-Node-PortLookup
                title: >-
                  A node shall find a port by name, optionally restricted to an input or an output, either
                  throwing or reporting failure when the port does not exist.
                justification: |
                  Scripts and file loaders refer to ports by name. Both a throwing lookup and a non-throwing
                  lookup are needed so callers can choose between strict construction code and tolerant parsing.
                tests:
                  - Node_TryGetPort_UniqueName_FindsPort
                  - Node_TryGetPort_MissingOrWrongDirection_ReturnsFalse
                  - Node_InputAndOutput_WrongDirectionOrMissing_Throw

              - id: Plexus-Model-Node-SharedPortNames
                title: >-
                  A node shall allow an input and an output to share one name, and shall refuse to resolve such a
                  name without a direction by reporting an ambiguity that names the explicit lookups.
                justification: |
                  Node types commonly use the same name on both sides (for example a position that is both
                  consumed and produced). Silently picking one side would create wrong connections, so the
                  ambiguity must be reported while the direction-specific lookups keep working.
                tests:
                  - Node_InputAndOutput_SameName_ReturnPortsOfTheRequestedDirection
                  - Node_Port_AmbiguousName_ThrowsInvalidOperationWithHint
                  - Node_TryGetPort_AmbiguousName_NeedsDirection

              - id: Plexus-Model-Node-ConnectedWires
                title: >-
                  A node and each of its ports shall list the wires connected to them in page order, and a port
                  shall be able to create a wire to another port.
                justification: |
                  Hosts need to enumerate the wires of a node or port, for example to highlight or delete them, and
                  to connect two ports directly from the port object.
                tests:
                  - Port_ConnectTo_OutputToInput_WireIsListedOnPortsAndNodes
                  - Node_Wires_RemovedNode_IsEmptyUntilUndo

              - id: Plexus-Model-Node-Bounds
                title: >-
                  A node shall report its bounding box and shall change it undoably through the bounds setter or a
                  move, doing nothing for an unchanged box and rejecting invalid boxes.
                justification: |
                  Positioning and resizing nodes is the core editing action. Undo support, no history entry for a
                  no-op and validation keep the model consistent and the history free of noise.
                tests:
                  - Node_MoveToAndBounds_MoveNodeAndRerouteWires
                  - Node_Bounds_SameOrInvalid_NoEntryOrThrows
                  - DiagramElement_GetBounds_NodeAnnotationGroup_ReturnTheirBounds

              - id: Plexus-Model-Node-Data
                title: >-
                  A node shall carry a host-defined data payload that can be replaced undoably, recording nothing
                  when the new value equals the current one.
                justification: |
                  Hosts attach their own objects to nodes. Treating the payload as an undoable value keeps host
                  data consistent with the rest of the diagram across undo and redo.
                tests:
                  - Node_Data_Set_UndoRedoRoundTrip
                  - Node_Data_SetEqualValue_RecordsNothing

              - id: Plexus-Model-Node-Visibility
                title: >-
                  An element shall report itself as hidden when any group that contains it, at any nesting depth, is
                  collapsed, and as visible otherwise.
                justification: |
                  Renderers and hit testing must skip elements that sit inside a collapsed group. A single rule on
                  the element base class gives every element kind the same behavior.
                tests:
                  - DiagramElement_IsVisible_FalseWhenAnyAncestorGroupIsCollapsed

              - id: Plexus-Model-Node-Removal
                title: >-
                  An element shall remove itself from its page undoably, shall keep its identifier across removal
                  and undo, and shall reject changes while it is removed.
                justification: |
                  Removal must be undoable and must restore the same element object under the same identifier so
                  host references stay valid. Rejecting changes to a detached element prevents edits that would be
                  lost or would corrupt the history.
                tests:
                  - DiagramElement_Remove_RemovesFromPage
                  - DiagramElement_Id_RemoveAndUndo_StaysTheSame
                  - Node_BoundsAndData_Set_OnRemovedNode_ThrowsInvalidOperationException
                  - DiagramPage_Remove_Element_MutationRejectedUntilUndo
                  - Node_Name_Set_OnRemovedNode_ThrowsInvalidOperationException

              - id: Plexus-Model-Node-ChangeNotification
                title: >-
                  An element shall raise a property-changed notification and report an element change to its diagram
                  for every changed property, including changes made by undo and redo.
                justification: |
                  User interfaces bind to element properties and refresh from diagram change events. Notifying on
                  undo and redo as well keeps views consistent without the host tracking history operations.
                tests:
                  - Node_PropertyChanged_NameBoundsAndData_RaisedForSetUndoAndRedo
                  - Node_Changed_BoundsSet_DiagramReportsElementChanged

              - id: Plexus-Model-Node-CloneData
                title: >-
                  A node shall provide an independent deep copy of its host data through the data type or serializer
                  of its node type, return null when it has no data, and refuse with a clear message when the data
                  cannot be copied; the copy and property changes shall be committable as one undo entry.
                justification: |
                  Editors modify a copy and commit it on OK; sharing the live object would change the document before
                  the user confirmed.
                tests:
                  - Node_CloneData_ReturnsIndependentCopy
                  - Node_CloneData_TypeWithoutSerializer_Throws
                  - Node_CloneData_CommittedWithPropertiesInOneTransaction_IsOneUndoEntry

              - id: Plexus-Model-Node-DataTypeCheck
                title: >-
                  Assigning a host payload to a node whose type declares a data type shall throw an argument
                  exception at once, recording nothing, when the payload is not an instance of that type, while the
                  declared type, a derived type and null are accepted; a type that declares only a serializer or
                  nothing shall accept any payload.
                justification: |
                  A payload of the wrong type would otherwise fail much later, when the diagram is saved or copied,
                  far from the code that caused it. Failing at the assignment names the mistake where it was made.
                tests:
                  - Node_Data_IncompatibleType_ThrowsArgumentException
                  - Node_Data_DeclaredDerivedOrNull_IsAccepted
                  - Node_Data_SerializerOnlyOrUndeclared_AcceptsAnyObject

              - id: Plexus-Model-Node-DynamicPorts
                title: >-
                  A node whose type has a port provider shall have the ports the provider returns for its current
                  properties and payload.
                justification: |
                  Decomposes Plexus-Model-DynamicPorts; the node is where hosts and wires find the ports, so it must
                  show the provider's ports as soon as it exists.
                tests:
                  - Node_Ports_PortProvider_NewNodeUsesProviderPorts

              - id: Plexus-Model-Node-DynamicPortRecompute
                title: >-
                  A node whose type has a port provider shall recompute its ports after each change of its properties
                  or payload.
                justification: |
                  Decomposes Plexus-Model-DynamicPorts; ports that follow the configuration must change whenever the
                  configuration changes, whichever member of the node was edited.
                tests:
                  - Node_Ports_DataChange_RecomputesPorts
                  - Node_Ports_CountIncreased_AddsPortsKeepingExistingInstancesAndWires

              - id: Plexus-Model-Node-DynamicPortIdentity
                title: >-
                  When a node's ports are recomputed, a port whose name remains within its direction shall keep its
                  port object and its wires and take its new row, label and type.
                justification: |
                  Decomposes Plexus-Model-DynamicPortIdentity; hosts and wires hold ports by reference, and keeping them
                  by name is what lets wires survive a reconfiguration such as adding channels or reordering outputs.
                tests:
                  - Node_Ports_CountIncreased_AddsPortsKeepingExistingInstancesAndWires
                  - Node_Ports_RenamedByName_ReattachesWiresByName
                  - Node_Ports_SurvivingPortRetyped_KeepsWiresStillAllowed

              - id: Plexus-Model-Node-DynamicPortNewNames
                title: >-
                  When a node's ports are recomputed, a port name that the node did not have in that direction shall
                  get a new port object.
                justification: |
                  Decomposes Plexus-Model-DynamicPortIdentity; a new name is a new port that starts without wires.
                tests:
                  - Node_Ports_CountIncreased_AddsPortsKeepingExistingInstancesAndWires

              - id: Plexus-Model-Node-StaticPorts
                title: >-
                  A node of a type without a port provider shall keep the type's declared ports when its properties or
                  payload change.
                justification: |
                  Decomposes Plexus-Model-DynamicPorts; most node types have fixed ports, and their nodes must not pay
                  for or be affected by port recomputation.
                tests:
                  - Node_Ports_NoPortProvider_KeepsTypePorts

              - id: Plexus-Model-Node-EmptyPortSet
                title: >-
                  When a port provider returns no ports for a direction, the node shall have no ports in that
                  direction and the wires of its former ports there shall be removed.
                justification: |
                  Decomposes Plexus-Model-DynamicPorts; a configuration may legitimately switch every port of a
                  direction off, which is not a failure.
                tests:
                  - Node_Ports_ProviderReturnsEmptySet_RemovesEveryPortAndWire

              - id: Plexus-Model-Node-DynamicPortWires
                title: >-
                  When recomputed ports remove a port, the wires attached to that port shall be removed.
                justification: |
                  Decomposes Plexus-Model-DynamicPortWireRemoval; a wire must never end at a port the node no longer
                  has.
                tests:
                  - Node_Ports_CountDecreased_RemovesPortsAndTheirWires

              - id: Plexus-Model-Node-DynamicPortRevalidation
                title: >-
                  When a kept port changes its type or fan-in, each of its wires shall be checked again with the
                  connection rules, removed when the rules refuse it and kept when they allow it.
                justification: |
                  Decomposes Plexus-Model-DynamicPortRuleRevalidation; a wire must never connect ports the host's rules
                  forbid, and a wire the rules still allow must not be lost.
                tests:
                  - Node_Ports_SurvivingPortRetyped_RemovesWiresTheRulesRefuse
                  - Node_Ports_SurvivingPortRetyped_KeepsWiresStillAllowed
                  - Node_Ports_SurvivingPortFanInRemoved_RemovesWiresTheRulesRefuse

              - id: Plexus-Model-Node-DynamicPortRevalidationOrder
                title: >-
                  The wires of retyped ports shall be checked in page order, each as a reconnect of itself after the
                  wires refused before it were removed, so that on an input that now accepts a single wire the wire
                  latest in page order is kept.
                justification: |
                  Decomposes Plexus-Model-DynamicPortRuleRevalidation; which wire survives must be predictable and
                  repeatable, and a wire must not count against its own port when it is judged.
                tests:
                  - Node_Ports_FanInRemoved_KeepsWireLatestInPageOrder

              - id: Plexus-Model-Node-DynamicPortSize
                title: >-
                  When recomputed ports change the number of inputs or outputs, the node shall take the height its
                  longer port column needs but never less than its type's default height, keeping its position and
                  width.
                justification: |
                  Decomposes Plexus-Model-DynamicPortResize; ports must stay inside the node box, and a node that loses
                  ports should not stay taller than a freshly added node with the same ports.
                tests:
                  - Node_Ports_MorePortsThanHeight_GrowsNodeAndReroutesWires
                  - Node_Ports_FewerPorts_ShrinksToFitNotBelowDefaultHeight
                  - Node_Ports_DeclaredSize_ShrinksNotBelowDeclaredHeight
                  - Node_Ports_ProviderReturnsEmptySet_RemovesEveryPortAndWire

              - id: Plexus-Model-Node-DynamicPortReroute
                title: >-
                  When recomputed ports move the end anchor of a remaining wire of the node, that wire shall be
                  re-routed.
                justification: |
                  Decomposes Plexus-Model-DynamicPortResize; wires must stay attached to the moved anchors, as after any
                  resize.
                tests:
                  - Node_Ports_MorePortsThanHeight_GrowsNodeAndReroutesWires
                  - Node_Ports_RenamedByName_ReattachesWiresByName

              - id: Plexus-Model-Node-DynamicPortGroupFrame
                title: >-
                  When recomputed ports change a node, the frames of the groups around it shall follow.
                justification: |
                  Decomposes Plexus-Model-DynamicPortResize; a group frame must keep enclosing its members.
                tests:
                  - Node_Ports_NodeInGroup_GroupFrameFollowsNewPorts

              - id: Plexus-Model-Node-DynamicPortKeepsSize
                title: >-
                  A recomputation that leaves the number of inputs and outputs unchanged shall leave the node's size
                  unchanged, including a size the host set.
                justification: |
                  Retyping, relabeling or reordering ports does not change how much room they need, so a size the user
                  or host chose must survive such an edit.
                tests:
                  - Node_Ports_SameCount_KeepsHandSetSize

              - id: Plexus-Model-Node-DynamicPortUndo
                title: >-
                  A property or payload change that recomputes ports shall be one undo entry whose undo and redo
                  restore the value, the same port objects, the wires and the bounds exactly.
                justification: |
                  Decomposes Plexus-Model-DynamicPortUndo; users undo what they did, not its internal steps.
                tests:
                  - Node_Ports_PropertyChange_IsOneUndoEntryAndRoundTripsExactly
                  - Node_Ports_Shrink_UndoRedoRestoreExactBounds

              - id: Plexus-Model-Node-UnchangedPorts
                title: >-
                  A property or payload change after which the provider returns equivalent ports shall record only the
                  change and report no ports change.
                justification: |
                  Decomposes Plexus-Model-DynamicPortUndo; most edits do not affect the ports, and they must keep their
                  plain undo entry (so consecutive edits still merge) and not make observers rebuild ports.
                tests:
                  - Node_Ports_UnchangedPorts_RaisesNoPortsChangeAndOneEntry

              - id: Plexus-Model-Node-ProviderFailure
                title: >-
                  When the port provider throws, builds an invalid port set, or a connection rule throws while wires
                  are checked again, the property or payload change shall be rolled back with every step it caused,
                  nothing shall be recorded, and the exception shall propagate.
                justification: |
                  Decomposes Plexus-Model-DynamicPortProviderFailure; a failure must never leave a half-applied edit in
                  the model or the history.
                tests:
                  - Node_Ports_ProviderDuplicateNames_ThrowsAndRevertsAssignment
                  - Node_Ports_ProviderThrows_RevertsAssignmentAndPropagates
                  - Node_Ports_RuleThrowsDuringRevalidation_RollsBackEverything

              - id: Plexus-Model-Node-ProviderNull
                title: >-
                  When the port provider returns no port set, the change shall fail with an invalid-operation error
                  naming the node type, and the change shall be reverted.
                justification: |
                  Decomposes Plexus-Model-DynamicPortProviderFailure; a missing result is a host bug that must be
                  reported where it can be found, not turned into a node without ports.
                tests:
                  - Node_Ports_ProviderReturnsNull_ThrowsInvalidOperation

              - id: Plexus-Model-Node-DynamicPortNotification
                title: >-
                  When a change recomputes a node's ports, the node shall report its ports as changed exactly once,
                  after every wire removal, the new bounds and every re-routed wire of the recomputation have been
                  applied and reported, followed by a bounds change of each enclosing group.
                justification: |
                  Decomposes Plexus-Model-DynamicPortNotification; observers that react to the ports change (for
                  example by rebuilding their view of the node) must see the settled model, and hosts that track wires
                  must learn about removed wires first.
                tests:
                  - Node_Ports_Change_ReportsWireRemovalsBeforePortsChanged
                  - Node_Ports_RetypedPortRefusedWire_RemovedBeforePortsChanged
                  - Node_Ports_Resize_BoundsAndRoutesSettledWhenPortsChanged

              - id: Plexus-Model-Node-DynamicPortUndoNotification
                title: >-
                  Undo and redo of a change that recomputed a node's ports shall each report the node's ports as
                  changed exactly once, after the wires, bounds, routes and the changed value are restored.
                justification: |
                  Decomposes Plexus-Model-DynamicPortNotification; observers must see a settled model whichever
                  direction the history moves.
                tests:
                  - Node_Ports_Undo_ReportsPortsChangeOnceAfterRestore

              - id: Plexus-Model-Node-DeferPortUpdates
                title: >-
                  Node.DeferPortUpdates shall apply the property and data changes of its action without recomputing the
                  ports and then recompute them once for the final state, recording everything as one undo entry even
                  when called outside a transaction.
                justification: |
                  Decomposes Plexus-Model-DynamicPortWireRemoval; hosts that commit several values (and node data)
                  together need the same final-state recomputation as PropertyBag.TrySetAll, or an intermediate state
                  would delete wires of a port the final state still has.
                tests:
                  - Node_DeferPortUpdates_OutsideTransaction_KeepsWireInOneEntry

              - id: Plexus-Model-Node-DeferPortUpdatesRollback
                title: >-
                  Node.DeferPortUpdates shall roll back the changes of an action that throws, also when it runs inside
                  an outer transaction.
                justification: |
                  Decomposes Plexus-Model-DynamicPortWireRemoval; a caller that catches the failure inside an outer
                  transaction must not be left with a changed value whose ports were never recomputed.
                tests:
                  - Node_DeferPortUpdates_ActionThrowsInsideOuterTransaction_RollsBackItsChanges
