---
# Software Subsystem requirements for Plexus Types.
#
# The Types subsystem holds the host declarations that nodes are created from: port types, node types and icons.
# Each requirement decomposes a system requirement (Plexus-Core-NodeTypes or Plexus-Core-Elements) and is verified
# by the subsystem tests in Types/TypesTests.cs, which use the NodeTypeRegistry and IconSource units together.

sections:
  - title: Plexus Requirements
    sections:
      - title: Types Requirements
        requirements:
          - id: Plexus-Types-Declaration
            title: >-
              The Types subsystem shall let a host declare port types with colors and node types with a key, title,
              ports, properties and an optional icon, and retrieve each declaration by key.
            justification: |
              Plexus knows nothing about the host's domain. Everything a node is, from its heading to its ports, comes
              from declarations the host registers up front and that the rest of Plexus looks up by key.
            children:
              - Plexus-Types-NodeTypeRegistry-Registration
              - Plexus-Types-NodeTypeRegistry-Naming
              - Plexus-Types-NodeTypeRegistry-PortDeclarations
              - Plexus-Types-NodeTypeRegistry-PortTypeColors
              - Plexus-Types-NodeTypeRegistry-SummaryLines
            tests:
              - Types_Declaration_PortTypesNodeTypesAndIcon_AreRetrievable

          - id: Plexus-Types-Validation
            title: >-
              The Types subsystem shall reject duplicate node type keys, port type keys, port names within a
              direction and property names, leaving earlier declarations unchanged, and shall prevent a registered
              node type from being modified.
            justification: |
              Duplicate or changing declarations make nodes, wires and saved documents ambiguous. Failing at
              registration time reports the host mistake early and keeps every live node consistent with its type.
            children:
              - Plexus-Types-NodeTypeRegistry-DuplicateKeys
              - Plexus-Types-NodeTypeRegistry-DuplicateMembers
              - Plexus-Types-NodeTypeRegistry-Freeze
              - Plexus-Types-NodeTypeRegistry-PortTypeDuplicates
            tests:
              - Types_Validation_DuplicateKeyAndMembers_AreRejectedLeavingRegistryUnchanged
              - Types_Validation_RegisteredType_CannotBeModified

          - id: Plexus-Types-Icons
            title: >-
              The Types subsystem shall let a node type carry an SVG icon created from SVG text, a file or an
              embedded resource, and shall give icons with equal content equal keys.
            justification: |
              Icons make node types recognizable in the diagram and in palettes. Content-derived identity lets
              painters share decoded images between node types that use the same artwork.
            children:
              - Plexus-Types-IconSource-FromSvg
              - Plexus-Types-IconSource-ContentKey
              - Plexus-Types-IconSource-Equality
              - Plexus-Types-IconSource-FromFile
              - Plexus-Types-IconSource-FromResource
              - Plexus-Types-NodeTypeRegistry-PresentationHints
            tests:
              - Types_Icons_SameSvgOnTwoNodeTypes_SharesKeyAndEquality

          - id: Plexus-Types-NodeDefaults
            title: >-
              The Types subsystem shall provide the declared ports and the declared default size of a node type, so a
              node added from the type starts with those ports and that size.
            justification: |
              Adding a node by type key must yield a ready-to-wire node without further setup. The type is the single
              source of the node's ports, labels and starting size.
            children:
              - Plexus-Types-NodeTypeRegistry-PortDeclarations
              - Plexus-Types-NodeTypeRegistry-PortFanIn
              - Plexus-Types-NodeTypeRegistry-PresentationHints
              - Plexus-Types-NodeTypeRegistry-CreateData
            tests:
              - Types_NodeDefaults_AddNode_UsesDeclaredPortsAndSize

          - id: Plexus-Types-Availability
            title: >-
              The Types subsystem shall make a node type available for creating nodes only while it is registered,
              so a removed type cannot be instantiated until it is registered again.
            justification: |
              Hosts tailor the offered types per document by removing some from a shared registry. Nodes must only
              be created from the types the registry currently offers.
            children:
              - Plexus-Types-NodeTypeRegistry-Registration
              - Plexus-Types-NodeTypeRegistry-Removal
            tests:
              - Types_Availability_RemoveAndReRegister_ControlsNodeCreation

          - id: Plexus-Types-PortProvider
            title: >-
              The Types subsystem shall let a node type declare a port provider that computes each node's input and
              output ports.
            justification: |
              Decomposes Plexus-Core-DynamicPorts; the node type is where hosts describe nodes, so it is also where
              the rule that derives a node's ports from its configuration is declared.
            children:
              - Plexus-Types-NodeTypeRegistry-PortProvider
              - Plexus-Types-NodeTypeRegistry-PortProviderEmpty
              - Plexus-Types-NodeTypeRegistry-PortSet
              - Plexus-Types-NodeTypeRegistry-PortSetReadOnly
              - Plexus-Types-NodeTypeRegistry-PortSetValidation
            tests:
              - Types_PortProvider_DeclaredOnType_SuppliesPerNodePorts
              - Types_PortProvider_InputsAndOutputs_ComputedPerNode

          - id: Plexus-Types-PortProviderDefaults
            title: >-
              The Types subsystem shall keep a node type's declared ports as its defaults when it has a port provider.
            justification: |
              Decomposes Plexus-Core-DynamicPorts; palettes, previews and drag sizes use the declared ports before a
              node exists.
            children:
              - Plexus-Types-NodeTypeRegistry-PortProviderDefaults
            tests:
              - Types_PortProvider_DeclaredOnType_SuppliesPerNodePorts

          - id: Plexus-Types-PortProviderNull
            title: >-
              The Types subsystem shall make node creation fail, naming the node type, when a port provider returns no
              port set.
            justification: |
              Decomposes Plexus-Core-DynamicPortFailure; a provider that returns nothing is a host bug that must be
              reported where it happens.
            children:
              - Plexus-Types-NodeTypeRegistry-PortProviderNull
            tests:
              - Types_PortProvider_ReturnsNull_AddNodeFails

          - id: Plexus-Types-Descriptions
            title: >-
              The Types subsystem shall let a host give a node type an optional description.
            justification: |
              Decomposes Plexus-Core-ElementDescriptions; descriptive text is part of the declarations hosts already
              make, so editors can show it without host code per element.
            children:
              - Plexus-Types-NodeTypeRegistry-Descriptions
            tests:
              - Types_Descriptions_PortNodeAndPortType_AreExposed

          - id: Plexus-Types-PortDescriptions
            title: >-
              The Types subsystem shall let a host give a port declaration an optional description that is exposed on
              the port.
            justification: |
              Decomposes Plexus-Core-PortDescriptions; users need to know what each port of a block means.
            children:
              - Plexus-Types-NodeTypeRegistry-PortDescription
            tests:
              - Types_Descriptions_PortNodeAndPortType_AreExposed

          - id: Plexus-Types-PortTypeDisplayName
            title: >-
              The Types subsystem shall let a host give a port type a display name that defaults to its key.
            justification: |
              Decomposes Plexus-Core-PortTypeNames; tooltips show readable type names instead of keys.
            children:
              - Plexus-Types-NodeTypeRegistry-PortTypeDisplayName
            tests:
              - Types_Descriptions_PortNodeAndPortType_AreExposed

          - id: Plexus-Types-ToolTipFunction
            title: >-
              The Types subsystem shall let a node type declare a tooltip function that yields a node's tooltip text
              from the node's current properties and payload.
            justification: |
              Decomposes Plexus-Core-LiveToolTips; hosts show live values and validation messages where the user
              points.
            children:
              - Plexus-Types-NodeTypeRegistry-ToolTipPrecedence
              - Plexus-Types-NodeTypeRegistry-ToolTipFailure
            tests:
              - Types_Descriptions_ToolTipFunction_FollowsNodeState
