---
# Software Subsystem requirements for Plexus Model.
#
# The Model subsystem is the document model of Plexus: the diagram root, the ordered pages and the elements placed on
# them. It decomposes the page, element, rename, wire, connection-rule, group, editing, undo/redo and change
# notification system requirements. Evidence is provided by the Model subsystem tests, which exercise the units
# working together.

sections:
  - title: Plexus Requirements
    sections:
      - title: Model Requirements
        requirements:
          - id: Plexus-Model-Pages
            title: >-
              The Model shall hold the pages of a diagram as an ordered list of named pages that can be added,
              inserted, renamed, reordered and removed, with a removed page rejecting edits until its removal is
              undone.
            justification: |
              Pages let a large diagram be split into manageable canvases. Page structure is part of the document, so
              the list must stay ordered and consistent across all page operations, and a removed page must not be
              editable while it is detached.
            children:
              - Plexus-Model-PageCollection-AddInsert
              - Plexus-Model-PageCollection-Remove
              - Plexus-Model-PageCollection-Move
              - Plexus-Model-DiagramPage-Name
              - Plexus-Model-DiagramPage-RemovedGuard
            tests:
              - Model_Pages_AddInsertRenameMoveRemove_KeepsOrderAndUndoes
              - Model_Pages_RemovedPage_RejectsEditsUntilUndo

          - id: Plexus-Model-Elements
            title: >-
              The Model shall add nodes by node-type key and annotations to a page, with unique generated or
              explicit names and ids, and find them again from the diagram by id or node name.
            justification: |
              Building a diagram starts with adding elements. Hosts need predictable unique identities for nodes,
              and need to find an element again without knowing which page holds it.
            children:
              - Plexus-Model-Diagram-NodeTypes
              - Plexus-Model-Diagram-Lookup
              - Plexus-Model-DiagramPage-AddNode
              - Plexus-Model-DiagramPage-NodeIdentity
              - Plexus-Model-DiagramPage-AddAnnotation
              - Plexus-Model-Node-Ports
              - Plexus-Model-Node-Data
              - Plexus-Model-Node-DataTypeCheck
              - Plexus-Model-Node-CloneData
              - Plexus-Model-Annotation-Initial
              - Plexus-Model-Annotation-Text
              - Plexus-Model-Annotation-Fill
            tests:
              - Model_Elements_AddNodesAndAnnotation_UseUniqueNamesAndAreFindable

          - id: Plexus-Model-Rename
            title: >-
              The Model shall rename a node through a pipeline that trims and validates the name, enforces
              uniqueness, lets the host correct or cancel the change, and applies it as an undoable change.
            justification: |
              Node names are user-visible identifiers with host-specific conventions. A single pipeline gives every
              rename path the same validation and the same host hook, and keeps renames in the undo history.
            children:
              - Plexus-Model-Diagram-RenameValidation
              - Plexus-Model-Diagram-RenameHook
              - Plexus-Model-Diagram-RenameUndo
            tests:
              - Model_Rename_ValidationHostHookAndUndo_AppliesCorrectionsAndRejects

          - id: Plexus-Model-Wires
            title: >-
              The Model shall connect an output port to an input port, given as port objects or "Node.port" paths,
              with a wire that is routed automatically or by a supplied route, and shall allow the wire route to be
              edited and recomputed.
            justification: |
              Wires carry the data flow between nodes. Hosts need to wire nodes up either from objects or from
              readable text paths, get a sensible route by default, and let users or code adjust or reset it.
            children:
              - Plexus-Model-DiagramPage-Connect
              - Plexus-Model-DiagramPage-ConnectByPath
              - Plexus-Model-DiagramPage-RerouteAll
              - Plexus-Model-Diagram-PortLookup
              - Plexus-Model-Node-PortLookup
              - Plexus-Model-Node-SharedPortNames
              - Plexus-Model-Node-ConnectedWires
              - Plexus-Model-Wire-Endpoints
              - Plexus-Model-Wire-Route
              - Plexus-Model-Wire-Points
              - Plexus-Model-Wire-Bounds
              - Plexus-Model-Wire-SetRoute
              - Plexus-Model-Wire-Reroute
            tests:
              - Model_Wires_ConnectByObjectsAndPath_RouteAndEdit

          - id: Plexus-Model-WireEditing
            title: >-
              The Model shall keep stored wire routes normalized, route each new wire around the wires of other
              nets already on the page, add draggable jogs to a wire, and move the ends of a wire to other ports
              under the connection rules, each edit being one undo entry.
            justification: |
              Interactive editors reshape and re-attach wires; the model supplies these operations so that every
              host gets the same validation, undo and routing behavior.
            children:
              - Plexus-Model-Wire-RouteNormalization
              - Plexus-Model-Wire-Reconnect
              - Plexus-Model-Wire-AddJog
            tests:
              - Plexus_WireNetsAndEditing_SeparateNetsJunctionsAndHandles_WorkThroughThePublicApi

          - id: Plexus-Model-ConnectionRules
            title: >-
              The Model shall apply structural connection rules and the host connection rule to every connection,
              and shall report whether two ports can be connected, with a denial reason, without changing the model.
            justification: |
              Invalid connections must never enter the model, and a UI needs to know in advance, and why, a
              connection is denied so it can give feedback while the user is still dragging.
            children:
              - Plexus-Model-DiagramPage-CanConnect
              - Plexus-Model-DiagramPage-ReconnectContext
              - Plexus-Model-Diagram-ConnectionRulesSetting
            tests:
              - Model_ConnectionRules_StructureAndHostRule_DenyWithReasons

          - id: Plexus-Model-Groups
            title: >-
              The Model shall group nodes, annotations and groups into nestable groups, dissolve groups, collapse
              and expand them, and move a group together with all its members.
            justification: |
              Groups organize large diagrams. A group must behave as one unit when moved, keep a consistent
              hierarchy, and hide its members when collapsed.
            children:
              - Plexus-Model-DiagramPage-CreateGroup
              - Plexus-Model-DiagramPage-Ungroup
              - Plexus-Model-DiagramPage-MoveGroup
              - Plexus-Model-Node-Visibility
              - Plexus-Model-Group-Members
              - Plexus-Model-Group-MemberRules
              - Plexus-Model-Group-Nesting
              - Plexus-Model-Group-Bounds
              - Plexus-Model-Group-Collapse
              - Plexus-Model-Group-CollapseHidesMembers
              - Plexus-Model-Group-Title
            tests:
              - Model_Groups_NestCollapseMoveAndUngroup_MembersFollow

          - id: Plexus-Model-Editing
            title: >-
              The Model shall move elements with the wires following them, remove elements together with their
              wires, and move elements between pages, removing wires that would span pages.
            justification: |
              Editing must always leave a consistent diagram: wires stay attached to their nodes, no wire is left
              without an end and no wire connects nodes of different pages.
            children:
              - Plexus-Model-DiagramPage-Move
              - Plexus-Model-DiagramPage-MoveWires
              - Plexus-Model-DiagramPage-Remove
              - Plexus-Model-Diagram-MoveToPage
              - Plexus-Model-Diagram-MoveToPageWires
              - Plexus-Model-Node-Bounds
              - Plexus-Model-Node-Removal
              - Plexus-Model-Annotation-Bounds
              - Plexus-Model-Annotation-Detached
              - Plexus-Model-Wire-Remove
              - Plexus-Model-Group-Detached
            tests:
              - Model_Editing_MoveAndRemove_WiresFollowAndAreRemoved
              - Model_Editing_MoveToPage_CarriesInternalWiresAndDropsOutsideWires

          - id: Plexus-Model-UndoRedo
            title: >-
              The Model shall record every mutation of pages and elements in one shared undo history so that
              undo and redo restore the exact model state step by step.
            justification: |
              Users expect to undo any edit. A single history covering all pages and element kinds, with exact
              restoration, makes undo and redo reliable for the whole document.
            children:
              - Plexus-Model-Diagram-SharedHistory
              - Plexus-Model-PageCollection-Undo
              - Plexus-Model-DiagramPage-Undo
            tests:
              - Model_UndoRedo_MixedEditingSession_RestoresEveryStateExactly

          - id: Plexus-Model-WireStyler
            title: >-
              The Model shall let the host assign a per-wire styler, evaluated on demand by scene builders, that is
              not part of the undoable content, and shall raise a change notification, without an undo entry, when
              the styler is assigned or when the host asks for a refresh because its styling inputs changed.
            justification: |
              Wire appearance that depends on what a wire connects, or on host state such as a simulation value, is
              configuration rather than content: it must repaint editors when it changes but must never pollute
              the undo history or the saved diagram.
            children:
              - Plexus-Model-Diagram-WireStyler
              - Plexus-Model-Diagram-Version
            tests:
              - Model_WireStyler_AssignAndRefresh_NotifyWithoutUndoEntries

          - id: Plexus-Model-NodeStyler
            title: >-
              The Model shall let the host assign a per-node styler, evaluated on demand by scene builders, that is
              not part of the undoable content, and shall raise a change notification, without an undo entry, when
              it is assigned.
            justification: |
              Like the wire styler, the node styler is configuration rather than content: it must repaint editors
              when it changes but must never pollute the undo history or the saved diagram.
            children:
              - Plexus-Model-Diagram-NodeStyler
            tests:
              - Model_NodeStyler_Assign_NotifiesWithoutUndoEntries
          - id: Plexus-Model-ChangeNotification
            title: >-
              The Model shall notify observers of every change, including undo and redo and setting changes, through
              the diagram Changed event and through observable page and content collections that are consistent when
              notified.
            justification: |
              Painters and editor controls stay correct only if they are told about every change. Notifications
              must also describe a settled model so handlers never observe half-applied changes.
            children:
              - Plexus-Model-Diagram-ChangeNotification
              - Plexus-Model-Diagram-Settings
              - Plexus-Model-Diagram-Options
              - Plexus-Model-Diagram-Initialize
              - Plexus-Model-PageCollection-Notification
              - Plexus-Model-PageCollection-NotificationOrder
              - Plexus-Model-PageCollection-ListBinding
              - Plexus-Model-DiagramPage-Notification
              - Plexus-Model-Node-ChangeNotification
              - Plexus-Model-Wire-ChangeNotification
              - Plexus-Model-Annotation-ChangeNotification
              - Plexus-Model-Group-ChangeNotification
            tests:
              - Model_ChangeNotification_EditsUndoAndRedo_RaiseChangedForEveryChange
              - Model_ChangeNotification_ObservableCollections_ReportAddMoveRemove

          - id: Plexus-Model-DynamicPorts
            title: >-
              The Model subsystem shall recompute the ports of a node whose type has a port provider after every
              change of the node's properties or payload.
            justification: |
              Decomposes Plexus-Core-DynamicPorts; the model owns the nodes and their ports, so it must keep each
              node's ports in step with its configuration.
            children:
              - Plexus-Model-Node-DynamicPorts
              - Plexus-Model-Node-DynamicPortRecompute
              - Plexus-Model-Node-StaticPorts
              - Plexus-Model-Node-EmptyPortSet
            tests:
              - Model_DynamicPorts_PropertyAndDataChanges_RecomputePortsInOneUndoEntry

          - id: Plexus-Model-DynamicPortIdentity
            title: >-
              The Model subsystem shall keep a recomputed port whose name remains within its direction as the same
              port, and create a new port for a new name.
            justification: |
              Decomposes Plexus-Core-DynamicPortIdentity; wires and hosts hold ports by reference, so a remaining
              port must stay the same object.
            children:
              - Plexus-Model-Node-DynamicPortIdentity
              - Plexus-Model-Node-DynamicPortNewNames
            tests:
              - Model_DynamicPorts_PropertyAndDataChanges_RecomputePortsInOneUndoEntry

          - id: Plexus-Model-DynamicPortWireRemoval
            title: >-
              The Model subsystem shall remove the wires of ports that a recomputation removes.
            justification: |
              Decomposes Plexus-Core-DynamicPortWireRemoval; no wire may end at a port its node no longer has.
            children:
              - Plexus-Model-Node-DynamicPortWires
              - Plexus-Model-Node-DeferPortUpdates
            tests:
              - Model_DynamicPorts_PropertyAndDataChanges_RecomputePortsInOneUndoEntry

          - id: Plexus-Model-DynamicPortRuleRevalidation
            title: >-
              The Model subsystem shall remove, after a recomputation changed the type or fan-in of a kept port, only
              the wires of that port that the connection rules now refuse.
            justification: |
              Decomposes Plexus-Core-DynamicPortRuleRevalidation; the host's connection rules must hold for every
              wire, while wires the rules still allow must be kept.
            children:
              - Plexus-Model-Node-DynamicPortRevalidation
              - Plexus-Model-Node-DynamicPortRevalidationOrder
            tests:
              - Model_DynamicPorts_RetypedPort_RemovesOnlyRefusedWires

          - id: Plexus-Model-DynamicPortResize
            title: >-
              The Model subsystem shall fit a node's height to its ports when a recomputation changes their number,
              keep the node's size otherwise, and re-route the wires whose ends moved.
            justification: |
              Decomposes Plexus-Core-DynamicPortResize; ports must stay inside the node box and wires attached to
              them, while a size the user chose survives edits that do not need more room.
            children:
              - Plexus-Model-Node-DynamicPortSize
              - Plexus-Model-Node-DynamicPortReroute
              - Plexus-Model-Node-DynamicPortGroupFrame
              - Plexus-Model-Node-DynamicPortKeepsSize
            tests:
              - Model_DynamicPorts_PortCountChange_FitsHeightAndReroutes

          - id: Plexus-Model-DynamicPortUndo
            title: >-
              The Model subsystem shall record a property or payload change and everything its port recomputation
              changes as one undo entry.
            justification: |
              Decomposes Plexus-Core-DynamicPortUndo; users undo what they did, not its internal steps.
            children:
              - Plexus-Model-Node-DynamicPortUndo
              - Plexus-Model-Node-UnchangedPorts
            tests:
              - Model_DynamicPorts_PropertyAndDataChanges_RecomputePortsInOneUndoEntry

          - id: Plexus-Model-DynamicPortProviderFailure
            title: >-
              The Model subsystem shall roll back a property or payload change whose port recomputation fails and
              record nothing.
            justification: |
              Decomposes Plexus-Core-DynamicPortFailure; a failing provider must never leave a half-applied edit.
            children:
              - Plexus-Model-Node-ProviderFailure
              - Plexus-Model-Node-ProviderNull
            tests:
              - Model_DynamicPorts_ProviderFails_RollsBackAndRecordsNothing

          - id: Plexus-Model-DynamicPortNotification
            title: >-
              The Model subsystem shall report a node's recomputed ports once per change, undo and redo, after the
              wires, bounds and routes affected by the recomputation are settled.
            justification: |
              Decomposes Plexus-Core-DynamicPortUndo; observers that rebuild their view of a node when its ports
              change must see a consistent model.
            children:
              - Plexus-Model-Node-DynamicPortNotification
              - Plexus-Model-Node-DynamicPortUndoNotification
            tests:
              - Model_DynamicPorts_Notifications_ReportPortsChangeAfterModelSettles

          - id: Plexus-Model-DynamicPortDetached
            title: >-
              The Model subsystem shall refuse to connect a port that a recomputation removed, even when a host still
              holds it.
            justification: |
              Decomposes Plexus-Core-DynamicPortWireRemoval; a wire to a removed port would point at a port the node
              no longer shows.
            children:
              - Plexus-Model-DiagramPage-DetachedPorts
            tests:
              - Model_DynamicPorts_RemovedPortHeldByHost_CannotBeConnected

          - id: Plexus-Model-DynamicPortAddNode
            title: >-
              The Model subsystem shall give a newly added node of a type with a port provider the provider's ports and
              a height that fits them.
            justification: |
              Decomposes Plexus-Core-DynamicPorts; a new node must be ready to wire with every port inside its box.
            children:
              - Plexus-Model-DiagramPage-AddNodePorts
              - Plexus-Model-DiagramPage-AddNodeHeight
              - Plexus-Model-DiagramPage-AddNodeProviderFailure
            tests:
              - Model_DynamicPorts_AddNode_UsesProviderPortsAndFitsHeight

          - id: Plexus-Model-HandlerFailureKeepsChange
            title: >-
              The Model subsystem shall complete and record as one entry a change during which a change handler
              throws.
            justification: |
              Decomposes Plexus-Core-HandlerFailureKeepsChange; the model and its history must stay consistent even
              when host code observing them fails.
            children:
              - Plexus-Model-Diagram-HandlerFailureKeepsChange
            tests:
              - Model_HandlerFailure_EditsUndoRedoAndTransactions_KeepModelAndHistoryConsistent

          - id: Plexus-Model-HandlerFailureReported
            title: >-
              The Model subsystem shall rethrow the first change-handler exception of a change after the change is
              complete, and let the change's own exception win when the change itself fails.
            justification: |
              Decomposes Plexus-Core-HandlerFailureReported; hosts must learn about failing handlers and about failed
              edits, in that priority.
            children:
              - Plexus-Model-Diagram-HandlerFailureReported
              - Plexus-Model-Diagram-HandlerFailureOperationFails
            tests:
              - Model_HandlerFailure_EditsUndoRedoAndTransactions_KeepModelAndHistoryConsistent

          - id: Plexus-Model-HandlerFailureUndoRedo
            title: >-
              The Model subsystem shall complete an undo or redo and move its entry when a change handler throws.
            justification: |
              Decomposes Plexus-Core-HandlerFailureUndoRedo; undo and redo must keep the stacks matching the model.
            children:
              - Plexus-Model-Diagram-HandlerFailureUndoRedo
            tests:
              - Model_HandlerFailure_EditsUndoRedoAndTransactions_KeepModelAndHistoryConsistent

          - id: Plexus-Model-HandlerFailureTransaction
            title: >-
              The Model subsystem shall roll back a whole transaction when a change handler throws during one of its
              edits.
            justification: |
              Decomposes Plexus-Core-HandlerFailureKeepsChange; a transaction must never commit half of its edits.
            children:
              - Plexus-Model-Diagram-HandlerFailureTransaction
            tests:
              - Model_HandlerFailure_EditsUndoRedoAndTransactions_KeepModelAndHistoryConsistent

          - id: Plexus-Model-GroupObstacles
            title: >-
              The Model shall give the router the frames of the visible groups that contain neither end node of a
              wire as obstacles when it computes the wire's stored route.
            justification: |
              Decomposes Plexus-Core-GroupObstacles; stored routes are computed by the page, which knows the group
              structure and which groups the wire belongs to.
            children:
              - Plexus-Model-DiagramPage-GroupObstacles
            tests:
              - Model_Groups_UnrelatedGroupFrame_IsAnObstacleForStoredRoutes
