---
# PlexusAvaloniaPropertyGrid platform requirements.
#
# These requirements specify the platforms and runtime the DemaConsulting.Plexus.Avalonia.PropertyGrid package must
# support. Source filters (windows@, ubuntu@, macos@, net10.0@) restrict which test results count as evidence for each
# requirement; removing them invalidates the evidence-based proof.

sections:
  - title: PlexusAvaloniaPropertyGrid Requirements
    sections:
      - title: Platform Support
        requirements:
          - id: PlexusAvaloniaPropertyGrid-Platform-Windows
            title: The system shall build and run on Windows platforms.
            tags: [system]
            justification: |
              Windows is the platform of the WinForms property grid users that the grid serves.
            tests:
              - "windows@PlexusAvaloniaPropertyGrid_ReflectionSource_ShowsAnnotatedObject"

          - id: PlexusAvaloniaPropertyGrid-Platform-Linux
            title: The system shall build and run on Linux platforms.
            tags: [system]
            justification: |
              Avalonia applications run on Linux desktops.
            tests:
              - "ubuntu@PlexusAvaloniaPropertyGrid_ReflectionSource_ShowsAnnotatedObject"

          - id: PlexusAvaloniaPropertyGrid-Platform-MacOS
            title: The system shall build and run on macOS platforms.
            tags: [system]
            justification: |
              Avalonia applications run on macOS desktops.
            tests:
              - "macos@PlexusAvaloniaPropertyGrid_ReflectionSource_ShowsAnnotatedObject"

          - id: PlexusAvaloniaPropertyGrid-Platform-Net10
            title: The system shall support the .NET 10 runtime.
            tags: [system]
            justification: |
              The package targets .NET 10, the current long-term support runtime.
            tests:
              - "net10.0@PlexusAvaloniaPropertyGrid_ReflectionSource_ShowsAnnotatedObject"
