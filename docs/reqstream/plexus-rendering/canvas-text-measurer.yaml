---
# Software Unit requirements for PlexusRendering CanvasTextMeasurer.
#
# Decomposes the PlexusRendering text-layout requirement into the responsibility of the unit that measures text.
# Each requirement states one criterion. Tests are the CanvasTextMeasurerTests unit tests.

sections:
  - title: PlexusRendering Requirements
    sections:
      - title: CanvasTextMeasurer Requirements
        requirements:
          - id: PlexusRendering-CanvasTextMeasurer-Width
            title: The measurer shall report a text width that grows with the length of the text.
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; node sizes and label wrapping are computed from widths.
            tests:
              - CanvasTextMeasurer_Measure_LongerText_IsWider

          - id: PlexusRendering-CanvasTextMeasurer-WidthFontSize
            title: The measurer shall report a text width that is proportional to the font size.
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; a larger font must produce proportionally larger
              layout, otherwise labels overflow their boxes.
            tests:
              - CanvasTextMeasurer_Measure_DoubleFontSize_DoublesWidth

          - id: PlexusRendering-CanvasTextMeasurer-Weight
            title: The measurer shall report bold text as at least as wide as the same text in regular weight.
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; group titles are bold and must not overflow their frames.
            tests:
              - CanvasTextMeasurer_Measure_Bold_IsAtLeastAsWide

          - id: PlexusRendering-CanvasTextMeasurer-LineHeight
            title: The measurer shall report a line height between one and 1.25 times the font size.
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; stacked lines keep a compact rhythm even for fonts with
              generous line gaps.
            tests:
              - CanvasTextMeasurer_Measure_LongerText_IsWider

          - id: PlexusRendering-CanvasTextMeasurer-LineHeightUniform
            title: The measurer shall report the same line height for every text of one style.
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; the height of a text row must not depend on which glyphs
              the text contains, so that rows of different texts line up.
            tests:
              - CanvasTextMeasurer_Measure_DifferentTexts_ShareLineHeight
              - CanvasTextMeasurer_Measure_LongerText_IsWider

          - id: PlexusRendering-CanvasTextMeasurer-EmptyText
            title: The measurer shall report zero width for an empty text (a string with no characters, not null).
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; empty labels and summaries are valid and must lay out as
              nothing instead of failing the render.
            tests:
              - CanvasTextMeasurer_Measure_EmptyString_HasZeroWidth
              - CanvasTextMeasurer_Measure_EmptyTextOrZeroSize_HasNoWidth

          - id: PlexusRendering-CanvasTextMeasurer-Degenerate
            title: >-
              The measurer shall report an empty size for a font size that is zero, negative, not a number or
              infinite.
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; the font engine rejects such sizes, and a degenerate
              style must lay out as nothing instead of failing the render.
            tests:
              - CanvasTextMeasurer_Measure_EmptyTextOrZeroSize_HasNoWidth
              - CanvasTextMeasurer_Measure_NegativeOrNonFiniteFontSize_IsEmpty

          - id: PlexusRendering-CanvasTextMeasurer-FontFallback
            title: The measurer shall measure with a bundled font when the requested font family is not installed.
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; rendering must work on machines without the theme font.
            tests:
              - CanvasTextMeasurer_Measure_UnknownFamily_FallsBackToBundledFont

          - id: PlexusRendering-CanvasTextMeasurer-Deterministic
            title: >-
              The measurer shall return the same size every time it measures the same text with the same style.
            justification: |
              Decomposes PlexusRendering-Render-Concurrency; reproducible layout requires reproducible measurement,
              which also makes sharing the measurer between threads safe.
            tests:
              - CanvasTextMeasurer_Measure_SameInput_IsDeterministic

          - id: PlexusRendering-CanvasTextMeasurer-FamilyCase
            title: The measurer shall resolve a font family name without regard to letter case.
            justification: |
              Decomposes PlexusRendering-Render-TextLayout; a theme that spells the family differently from the
              installed font must still measure and paint with the same font.
            tests:
              - CanvasTextMeasurer_Measure_SameInput_IsDeterministic

          - id: PlexusRendering-CanvasTextMeasurer-InvalidInput
            title: The measurer shall throw an argument-null exception when given no text.
            justification: |
              Decomposes PlexusRendering-Render-InvalidInput; a missing text (null, as opposed to an empty string)
              must fail early.
            tests:
              - CanvasTextMeasurer_Measure_NullArguments_Throw

          - id: PlexusRendering-CanvasTextMeasurer-NullStyle
            title: The measurer shall throw an argument-null exception when given no style.
            justification: |
              Decomposes PlexusRendering-Render-InvalidInput; a missing style must fail early.
            tests:
              - CanvasTextMeasurer_Measure_NullArguments_Throw
