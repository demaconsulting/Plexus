---
# PlexusRendering platform requirements.
#
# These requirements specify the platforms and runtime the DemaConsulting.Plexus.Rendering package must support.
# Source filters (windows@, ubuntu@, macos@, net10.0@, net11.0@) restrict which test results count as evidence for
# each requirement; removing them invalidates the evidence-based proof.

sections:
  - title: PlexusRendering Requirements
    sections:
      - title: Platform Support
        requirements:
          - id: PlexusRendering-Platform-Windows
            title: The system shall build and run on Windows platforms.
            tags: [system]
            justification: |
              Windows is a major development and automation platform for diagram rendering.
            tests:
              - "windows@PlexusRendering_RenderPng_DiagramPage_ProducesDecodablePng"

          - id: PlexusRendering-Platform-Linux
            title: The system shall build and run on Linux platforms.
            tags: [system]
            justification: |
              Rendering runs headless in Linux containers and CI/CD agents, which is the primary server scenario.
            tests:
              - "ubuntu@PlexusRendering_RenderPng_DiagramPage_ProducesDecodablePng"

          - id: PlexusRendering-Platform-MacOS
            title: The system shall build and run on macOS platforms.
            tags: [system]
            justification: |
              Developers on Apple platforms must be able to render diagrams locally.
            tests:
              - "macos@PlexusRendering_RenderPng_DiagramPage_ProducesDecodablePng"

          - id: PlexusRendering-Platform-Net10
            title: The system shall support the .NET 10 runtime.
            tags: [system]
            justification: |
              .NET 10 is the current Long-Term Support (LTS) release. Supporting this runtime provides
              a stable, long-term supported target for users who prefer LTS releases.
            tests:
              - "net10.0@PlexusRendering_RenderPng_DiagramPage_ProducesDecodablePng"

          - id: PlexusRendering-Platform-Net11
            title: The system shall support the .NET 11 runtime.
            tags: [system]
            justification: |
              .NET 11 is the latest release in the .NET platform roadmap. Supporting this runtime
              ensures the package works for users as they adopt the newest .NET version.
            tests:
              - "net11.0@PlexusRendering_RenderPng_DiagramPage_ProducesDecodablePng"
