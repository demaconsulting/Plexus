---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Project-specific technical terms and tool names
words:
  - apimark
  - axaml
  - ApiMark
  - inheritdoc
  - msbuild
  - Tomlyn
  - buildmark
  - DEMA
  - Dema
  - FileAssert
  - fileassert
  - xunit
  - Pandoc
  - Qube
  - reqstream
  - reviewmark
  - Sarif
  - SARIF
  - sarifmark
  - sonarmark
  - sysml
  - versionmark
  - Weasy
  - WeasyPrint
  - weasyprint
  - netstandard
  - yamlfix
  # Plexus domain and dependency terms
  - dwmapi
  - Avalonia
  - canvasnet
  - CanvasNet
  - demaconsulting
  - FlaUI
  - focusable
  - browsable
  - Skia
  - slnx
  - Segoe
  - headlessly
  - undoable
  - undoably
  - redoable
  - ungroup
  - ungrouping
  - rects
  - rasterizations
  - rasterizes
  - rasterizing
  - reparsed
  - rethrowing
  - pngs
  - ADSR
  - RGBA
  - BGRA
  - Argb
  - AARRGGBB
  - RRGGBB
  - LTRB
  - HRESULT
  - CLIPBRD
  - ordinally
  - ROOTOWNER
  # Test fixture literals (sample names, keystroke-like strings and sample text)
  - Cutme
  - fghij
  - ijlt
  - Namey
  - undu
  - ünïcode
  - Xena
  - zoomtofit

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - "src/**/api/**"
  - package-lock.json
