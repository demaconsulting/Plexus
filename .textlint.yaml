---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# The files to spell-check
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"
# Also check hidden paths such as .github/ and .*.yaml
enableGlobDot: true

# Project-specific technical terms and tool names
words:
  - AARRGGBB
  - Adsr
  - ADSR
  - Argb
  - ARGB
  - axaml
  - BGRA
  - browsable
  - Browsable
  - Butterworth
  - CLIPBRD
  - Cutme
  - Dema
  - DEMA
  - demaconsulting
  - DEMACONSULTINGNUGETKEY
  - dwmapi
  - fghij
  - headlessly
  - Headlessly
  - HRESULT
  - ijlt
  - Labelled
  - LTRB
  - Namey
  - ncipollo
  - nestings
  - netstandard
  - ordinally
  - pngs
  - Qube
  - rasterizations
  - Rasterizations
  - redoable
  - Renam
  - reparsed
  - ROOTOWNER
  - sarif
  - Sarif
  - SARIF
  - Setext
  - shopt
  - slnx
  - snupkg
  - sonarscanner
  - thirdparty
  - Tomlyn
  - undoable
  - Undoable
  - undoably
  - Undoably
  - undu
  - ungroup
  - Ungroup
  - ungrouping
  - ünïcode
  - unidirectionality
  - venv
  - Weasy
  - Xena
  - yamlfix
  - zoomtofit

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - "src/**/api/**"
  - package-lock.json
