# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"  # Verification documentation files
  - "docs/user_guide/**/*.md"    # User guide documentation
  - "docs/sysml2/**/*.sysml"     # SysML2 architecture model
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!node_modules/**"           # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment
  - "!demo/**"                    # Exclude demo applications (not shipped, not software items)
  - "!tools/**"                   # Exclude agent tooling (not shipped, not software items)
  - "!test/DemaConsulting.Plexus.Demo.Tests/**"    # Exclude demo test project (not shipped)
  - "!test/DemaConsulting.Plexus.Puppet.Tests/**"  # Exclude tooling test project (not shipped)

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/Plexus/reviews/index.json

# Global context shown to every reviewer for orientation (not fingerprinted).
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose Review (only one per repository)
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    context:
      - "!docs/design/introduction.md"                              # exclude design intro from user-facing review
    paths:
      - "README.md"                                                 # project readme
      - "docs/user_guide/**/*.md"                                   # user guide

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that Plexus Decomposition Addresses the Stated Purpose
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "requirements.yaml"                                         # root requirements file
      - "docs/design/introduction.md"                               # design introduction
      - "docs/sysml2/**/*.sysml"                                    # SysML2 model (authoritative structure)

  # Plexus-Architecture Review (one per system)
  - id: Plexus-Architecture
    title: Review that Plexus Architecture Satisfies Requirements
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/plexus.yaml"                                    # system requirements
      - "docs/design/introduction.md"                                # design introduction
      - "docs/design/plexus.md"                                         # system design
      - "docs/verification/introduction.md"                          # verification introduction
      - "docs/verification/plexus.md"                                   # system verification
      - "src/DemaConsulting.Plexus/NamespaceDoc.cs"  # root namespace documentation and usage example
      - "test/DemaConsulting.Plexus.Tests/PlexusTests.cs"  # system integration tests
      - "test/DemaConsulting.Plexus.Tests/PlexusWireStylingTests.cs"  # system/subsystem wire styling tests
      - "test/DemaConsulting.Plexus.Tests/PlexusNodeStylingTests.cs"  # system/subsystem node styling tests
      - "test/DemaConsulting.Plexus.Tests/TestModel.cs"  # shared test fixture
      - "test/DemaConsulting.Plexus.Tests/Routing/RouteAssertions.cs"  # shared test fixture
      - "test/DemaConsulting.Plexus.Tests/Scene/SceneTestModel.cs"  # shared test fixture
      - "test/DemaConsulting.Plexus.Tests/Serialization/SerializationFixtures.cs"  # shared test fixture

  # Plexus-Design Review (one per system)
  - id: Plexus-Design
    title: Review that Plexus Design is Consistent and Complete
    context:
      - "docs/reqstream/plexus.yaml"
    paths:
      - "docs/reqstream/plexus/platform-requirements.yaml"              # platform requirements
      - "docs/design/introduction.md"                                # design introduction
      - "docs/design/plexus.md"                                         # system design
      - "docs/design/plexus/**/*.md"                                    # all system design documents
      - "docs/design/ots.md"                                         # OTS overview

